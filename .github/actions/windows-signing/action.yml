name: Windows signing
description: >
  Configure the existing Windows signing identity through sealed private commands.
  Missing signing configuration leaves the build unsigned. Once preflight passes,
  signing and verification are mandatory.

inputs:
  client-id: { description: Entra application (client) ID of qualitylayer-github-signing, required: false, default: "" }
  tenant-id: { description: Entra tenant ID, required: false, default: "" }
  subscription-id: { description: Subscription that holds the signing account, required: false, default: "" }
  resource-group: { description: Resource group of the signing account, required: false, default: "" }
  endpoint: { description: "Artifact Signing endpoint, e.g. https://neu.codesigning.azure.net/", required: false, default: "" }
  account: { description: Artifact Signing account name, required: false, default: "" }
  profile: { description: Public Trust certificate profile name, required: false, default: "" }

outputs:
  enabled:
    description: "'true' when files must be signed and verified; 'false' when this build stays unsigned"
    value: ${{ steps.preflight.outputs.enabled }}

runs:
  using: composite
  steps:
    - name: Private Windows signing preflight
      id: preflight
      shell: pwsh
      env:
        QL_CLIENT_ID: ${{ inputs.client-id }}
        QL_TENANT_ID: ${{ inputs.tenant-id }}
        QL_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        QL_RESOURCE_GROUP: ${{ inputs.resource-group }}
        QL_ENDPOINT: ${{ inputs.endpoint }}
        QL_ACCOUNT: ${{ inputs.account }}
        QL_PROFILE: ${{ inputs.profile }}
        QL_RELEASE_CAPABILITIES: windows-signing-oidc
        QL_RELEASE_METADATA_CONTROL: 'false'
        QL_RELEASE_EXPORTS: '{"GITHUB_OUTPUT":{"enabled":"boolean"},"GITHUB_ENV":{"QUALITYLAYER_WINDOWS_SIGNING_PROFILE":"azure-signing-profile"}}'
      run: python "${{ github.workspace }}/.github/scripts/release-private-command.py" pwsh "${{ github.workspace }}/.github/private-workflows/windows-signing/preflight.ps1"

    - name: Report unsigned fallback
      if: steps.preflight.outputs.enabled == 'false'
      shell: pwsh
      run: Write-Output '::warning::Windows signing is unavailable; files from this run remain unsigned.'

    - name: Private signing tools and command
      if: steps.preflight.outputs.enabled == 'true'
      shell: pwsh
      env:
        QL_ENDPOINT: ${{ inputs.endpoint }}
        QL_ACCOUNT: ${{ inputs.account }}
        QL_PROFILE: ${{ inputs.profile }}
        QL_RELEASE_METADATA_CONTROL: 'false'
        QL_RELEASE_EXPORTS: '{"GITHUB_ENV":{"QUALITYLAYER_WINDOWS_SIGN_COMMAND":"windows-sign-command"}}'
      run: python "${{ github.workspace }}/.github/scripts/release-private-command.py" pwsh "${{ github.workspace }}/.github/private-workflows/windows-signing/setup.ps1"
