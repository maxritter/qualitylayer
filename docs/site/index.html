        <h1>The software factory with you in the loop</h1>
        <p>

        </p>
        <figure>
          <blockquote><p>“With QualityLayer, developing software with agents finally feels like doing real engineering again.”</p></blockquote>
          <figcaption>An engineer who uses QualityLayer</figcaption>
        </figure>
        <pre><code>Plan usage billing with safe retries.</code></pre>
        <p>Example request for + New; no task is submitted. <a href="/download">Download the App</a></p>
      </header>
      <main>
        <section>
          <h2>How a request becomes a reviewed change</h2>
          <ul>
            <li>Plan: Your agent reads the code, asks what only you can answer and writes one Plan with diagrams and clickable designs. You approve it once.</li>
            <li>Implement: Your agent cuts the Plan into slices and builds them test first, handing independent work to other agents when useful.</li>
            <li>Verify: Agents that did not write the code check every point and fix what fails. Then you review the code and approve.</li>
            <li>Artifacts: ask your agent to draw a page, open it full size in the App and comment on a spot. Artifacts stay on your own machines; use Ask agent to prepare a contextual request.</li>
            <li>Local memory keeps project lessons, with optional Git export and explicit repository restore. Every plan includes the same complete local product.</li>
          </ul>
          <picture>
            <source media="(max-width:640px) and (prefers-color-scheme:dark)" srcset="/product/plan-phone-dark.webp" width="680" height="282">
            <source media="(max-width:640px)" srcset="/product/plan-phone-light.webp" width="680" height="282">
            <source media="(prefers-color-scheme:dark)" srcset="/product/plan-dark.webp">
            <img src="/product/plan-light.webp" width="2664" height="2024" alt="Illustrative Plan for usage-based billing: its open decision with both paths drawn, beside Claude Code">
          </picture>
          <p>Illustrative billing task. On desktop, the visual Plan sits beside Conversation. You approve the Plan before the build starts.</p>
        </section>
        <section>
          <h2>Install</h2>
          <p>Download the QualityLayer App for macOS, Windows or Linux at <a href="https://qualitylayer.dev/download">qualitylayer.dev/download</a>. On a server, in WSL or in a container, install the command line:</p>
          <pre><code>curl -fsSL https://qualitylayer.dev/install.sh | bash</code></pre>
          <p>Open the App or run <code>qualitylayer app</code> for the browser workspace. Choose + New, pick Claude Code, Codex, Cursor, Grok, Antigravity, Pi, OpenCode or GitHub Copilot, and describe the change. Your own terminal, VS Code or another IDE remains an alternative through the CLI.</p>
