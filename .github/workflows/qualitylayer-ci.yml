  windows-terminal:
    name: Native ConPTY (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: plaintext-guard
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
    defaults:
      run:
        shell: pwsh
        working-directory: qualitylayer
    steps:
      - name: Check out with LF line endings
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Qualify public POSIX command channels before private source
        if: runner.os != 'Windows'
        shell: bash
        env:
          QL_CANARY_ONLY: ""
          PYTHONPATH: ""
          QL_CANARY_TRACE_PATH: ""
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/canary-private-command.py" "$GITHUB_WORKSPACE/.github/scripts/release-private-command.py"
      - name: Qualify public Windows command channels before private source
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QL_CANARY_ONLY: ""
          PYTHONPATH: ""
          QL_CANARY_TRACE_PATH: ""
        run: python "$env:GITHUB_WORKSPACE/.github/scripts/canary-private-command.py" "$env:GITHUB_WORKSPACE/.github/scripts/release-private-command.py"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-windows-x64.zip
      - name: Unlock repository
        working-directory: .
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'git-crypt.key'
          [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:GIT_CRYPT_KEY))
          try { bun .github/workflows/scripts/git-crypt-unlock.ts $key } finally { Remove-Item -LiteralPath $key -Force }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: bun install --frozen-lockfile
      - name: Verify OS and Bun run natively
        run: python "${{ github.workspace }}/.github/scripts/release-private-command.py" pwsh "${{ github.workspace }}/.github/private-workflows/ci-commands/141445ce5e6ca4a1e8969875b08951f663cc24e106f063ff0392fce92d23b570.ps1"
        env:
          QL_RELEASE_EXPORTS: "{}"
          QL_CI_INPUT_1: ${{ matrix.arch }}
        shell: pwsh
      - name: Build matching private candidate and key
        run: python "${{ github.workspace }}/.github/scripts/release-private-command.py" pwsh "${{ github.workspace }}/.github/private-workflows/ci-commands/689ab30db69c53ad2c59730125870ae5d66c34c20877c2627a32ce8ac36bcc97.ps1"
        env:
          QL_RELEASE_EXPORTS: '{"GITHUB_ENV":{"QUALITYLAYER_TEST_BINARY":"temp-path","QUALITYLAYER_TEST_TRIAL_KEY_FILE":"temp-path"}}'
          QL_CI_INPUT_1: ${{ matrix.arch }}
        shell: pwsh
      - name: Build matching native Rust launcher for the installed command path
        timeout-minutes: 5
        run: python "${{ github.workspace }}/.github/scripts/release-private-command.py" pwsh "${{ github.workspace }}/.github/private-workflows/ci-commands/7038860822a12e6a787b467251f868f3a1f350e59dcfc7038ba99d52c408c8c5.ps1"
        env:
          QL_RELEASE_EXPORTS: '{"GITHUB_ENV":{"QUALITYLAYER_TEST_LAUNCHER":"temp-path"}}'
        shell: pwsh
      - name: Execute compiled ConPTY and Job lifecycle contracts
        env:
          QUALITYLAYER_REQUIRE_WINDOWS_NATIVE: "1"
          QUALITYLAYER_EXPECT_ARCH: ${{ matrix.arch }}
          QL_RELEASE_EXPORTS: "{}"
        run: python "${{ github.workspace }}/.github/scripts/release-private-command.py" pwsh "${{ github.workspace }}/.github/private-workflows/ci-commands/8ddbce549a39af350fd503051010d819cdbf4a2abf915afb3dfedb7288f0ebbf.ps1"
        shell: pwsh
    if: github.repository == 'maxritter/qualitylayer' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
