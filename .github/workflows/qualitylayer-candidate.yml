---
name: QualityLayer candidate qualification
permissions:
  contents: read
jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Validate the private staging request
      env:
        VERSION: "${{ inputs.version }}"
        AUTHORIZATION: "${{ inputs.authorization_environment }}"
      run: |
        set -euo pipefail
        [ "$GITHUB_REPOSITORY" = maxritter/qualitylayer ]
        [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
        [[ "$VERSION" =~ ^(1[2-9]|[2-9][0-9]|[1-9][0-9]{2,})\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
        case "$GITHUB_WORKFLOW_REF" in
          maxritter/qualitylayer/.github/workflows/release.yml@refs/heads/main|maxritter/qualitylayer/.github/workflows/release.yml@refs/heads/dev) ;;
          *) echo 'Stage through the guarded Release workflow on main or dev'; exit 1 ;;
        esac
        case "$AUTHORIZATION" in
          beta) ;;
          production) [ "$GITHUB_REF_NAME" = main ] ;;
          *) echo 'Unknown signing authorization environment'; exit 1 ;;
        esac
  memory-payload:
    name: Native memory payload (${{ matrix.target }})
    needs:
    - validate-inputs
    - private-command-preflight
    permissions:
      contents: read
      id-token: write
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: darwin-arm64
          os: macos-26
          arch: arm64
        - target: darwin-x64
          os: macos-15-intel
          arch: x64
        - target: linux-x64
          os: ubuntu-22.04
          arch: x64
        - target: linux-arm64
          os: ubuntu-24.04-arm
          arch: arm64
        - target: win32-x64
          os: windows-2025
          arch: x64
    environment: "${{ inputs.authorization_environment }}"
    defaults:
      run:
        shell: bash
    steps:
    - name: Preserve encrypted bytes on Windows
      if: runner.os == 'Windows'
      run: git config --global core.autocrlf false
    - if: runner.os == 'Windows'
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout qualification sources
      if: runner.os != 'Windows'
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
        sparse-checkout: |
          .github
          qualitylayer/scripts
          qualitylayer/src/core
          qualitylayer/src/memory-engine
          qualitylayer/tests/helpers
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.4
        bun-download-url: "${{ runner.os == 'Windows' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-windows-x64.zip'
          || '' }}"
        no-cache: true
    - name: Install git-crypt
      if: runner.os != 'Windows'
      run: bash .github/workflows/scripts/install-git-crypt.sh
    - name: Unlock repository
      if: runner.os != 'Windows'
      env:
        GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}"
      run: bash .github/workflows/scripts/setup-git-crypt.sh
    - name: Unlock repository on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}"
      run: |
        $key = Join-Path $env:RUNNER_TEMP 'git-crypt.key'
        [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:GIT_CRYPT_KEY))
        try { bun .github/workflows/scripts/git-crypt-unlock.ts $key } finally { Remove-Item -LiteralPath $key -Force }
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Read pinned current and approved previous bytes without rebuilding Go
      env:
        TARGET: "${{ matrix.target }}"
        QL_RELEASE_EXPORTS: "{}"
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/0588539f8adaf412e66a535e9b97b218db1b8eeede5b04d00a45622132e75ba0.sh"
      shell: bash
    - name: Import the Developer ID certificate
      if: runner.os == 'macOS'
      env:
        APPLE_CERTIFICATE: "${{ secrets.APPLE_CERTIFICATE }}"
        APPLE_CERTIFICATE_PASSWORD: "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
        QL_RELEASE_EXPORTS: "{}"
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/8b2f2b646a95c6e6ba5612520950da7a860a60bb472c7ba921c8a126fab28a54.sh"
      shell: bash
    - name: Sign and notarize the actual Darwin engine before compression
      if: runner.os == 'macOS'
      env:
        TARGET: "${{ matrix.target }}"
        ASC_KEY_ID: "${{ secrets.ASC_KEY_ID }}"
        ASC_ISSUER_ID: "${{ secrets.ASC_ISSUER_ID }}"
        ASC_PRIVATE_KEY: "${{ secrets.ASC_PRIVATE_KEY }}"
        QL_RELEASE_EXPORTS: "{}"
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/382db28b5eac616c6ed9adc5b62ca1f272d0530225dfa8f1d07f6de89bfabe4a.sh"
      shell: bash
    - name: Windows signing
      id: signing
      if: runner.os == 'Windows'
      uses: "./.github/actions/windows-signing"
      with:
        client-id: "${{ secrets.AZURE_CLIENT_ID }}"
        tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
        subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        resource-group: "${{ vars.AZURE_SIGNING_RESOURCE_GROUP }}"
        endpoint: "${{ vars.AZURE_SIGNING_ENDPOINT }}"
        account: "${{ vars.AZURE_SIGNING_ACCOUNT }}"
        profile: "${{ vars.AZURE_SIGNING_PROFILE }}"
    - name: Sign the actual Windows engine before compression
      if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
      shell: pwsh
      env:
        TARGET: "${{ matrix.target }}"
        QL_RELEASE_EXPORTS: "{}"
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        pwsh "${{ github.workspace }}/.github/private-workflows/release-commands/fe1971b9184933eff5b548e03b45f108ec9c880eba91aea74253ba0751557297.ps1"
    - name: Record the exact platform signing policy and stage bytes
      env:
        TARGET: "${{ matrix.target }}"
        QL_RELEASE_EXPORTS: "{}"
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/2cc529131179271a57954657009dccc9251b9c4f92a461cb89be65c86c70dade.sh"
      shell: bash
    - name: 'Stage only reviewed export members: payload'
      if: success()
      shell: bash
      env:
        QL_EXPORT_SOURCE: "${{ runner.temp }}/piece/"
        QL_EXPORT_DESTINATION: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-memory-payload-13"
        QL_EXPORT_KIND: payload
        QL_EXPORT_VERSION: "${{ inputs.version }}"
        QL_EXPORT_TARGET: "${{ matrix.target }}"
      run: python3 "${{ github.workspace }}/.github/scripts/stage-release-artifact.py"
        --kind "$QL_EXPORT_KIND" --source "$QL_EXPORT_SOURCE" --destination "$QL_EXPORT_DESTINATION"
        --version "$QL_EXPORT_VERSION" --target "$QL_EXPORT_TARGET"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: success()
      with:
        name: memory-payload-${{ matrix.target }}-${{ github.run_attempt }}
        path: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-memory-payload-13"
        retention-days: 7
    if: "${{ needs.private-command-preflight.result == 'success' }}"
  payload-readiness:
    needs:
    - memory-payload
    - private-command-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      provenance_sha256: "${{ steps.provenance.outputs.sha256 }}"
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - run: bash .github/workflows/scripts/install-git-crypt.sh
    - env:
        GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}"
      run: bash .github/workflows/scripts/setup-git-crypt.sh
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.4
        no-cache: true
    - run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/51e9c97aeb5bc217cf374406fbfdcc8d8bc7bdb703e9d245c3759db25be6381c.sh"
      working-directory: qualitylayer
      env:
        QL_RELEASE_EXPORTS: "{}"
      shell: bash
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: memory-payload-*-${{ github.run_attempt }}
        path: "${{ runner.temp }}/pieces"
    - name: Validate five native cells and bind their exact receipts
      id: provenance
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/ffc1555f8f07cdd28b23b4dcdc6a64823fcad6822408f5fd7e13362d7f0b85d4.sh"
      env:
        QL_RELEASE_EXPORTS: '{"GITHUB_OUTPUT":{"sha256":"sha256"}}'
      shell: bash
    - name: 'Stage only reviewed export members: payload'
      if: success()
      shell: bash
      env:
        QL_EXPORT_SOURCE: "${{ runner.temp }}/stage/"
        QL_EXPORT_DESTINATION: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-payload-readiness-7"
        QL_EXPORT_KIND: payload
        QL_EXPORT_VERSION: "${{ inputs.version }}"
      run: python3 "${{ github.workspace }}/.github/scripts/stage-release-artifact.py"
        --kind "$QL_EXPORT_KIND" --source "$QL_EXPORT_SOURCE" --destination "$QL_EXPORT_DESTINATION"
        --version "$QL_EXPORT_VERSION"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: memory-payload-stage-${{ github.run_attempt }}
        path: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-payload-readiness-7"
        retention-days: 7
      if: success()
    if: "${{ needs.private-command-preflight.result == 'success' }}"
  payload-authorization:
    name: Authorize the qualified payload bytes
    needs:
    - payload-readiness
    - private-command-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "${{ inputs.authorization_environment }}"
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
        sparse-checkout: ".github/scripts"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: memory-payload-stage-${{ github.run_attempt }}
        path: stage
    - name: Sign the trusted same-run payload authorization
      env:
        EXPECTED_SHA256: "${{ needs.payload-readiness.outputs.provenance_sha256 }}"
        RELEASE_SIGNING_KEY: "${{ secrets.RELEASE_SIGNING_KEY }}"
        RELEASE_SIGNER: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOvc89TsfxkzK1lxTNLr/FHwImLq1oUWYmmXQ1iYL2oU
      run: |
        set -euo pipefail
        [ "$(sha256sum stage/provenance.json | awk '{print $1}')" = "$EXPECTED_SHA256" ]
        jq -e --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" '.kind == "memory-payload-authorization" and .repository == "maxritter/qualitylayer" and .workflow == ".github/workflows/qualitylayer-candidate.yml" and .sourceCommit == $sha and .runId == $run and .runAttempt == $attempt and (.receipts | keys | sort) == ["darwin-arm64","darwin-x64","linux-arm64","linux-x64","win32-x64"]' stage/provenance.json
        for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
          expected=$(jq -r --arg target "$target" '.receipts[$target]' stage/provenance.json)
          [ "$(sha256sum "stage/receipts/$target.json" | awk '{print $1}')" = "$expected" ]
          jq -e --arg sha "$GITHUB_SHA" --arg target "$target" '.status == "passed" and .target == $target and .sourceCommit == $sha' "stage/receipts/$target.json"
        done
        key="${RUNNER_TEMP:?}/payload-signing-key"
        trap 'rm -f "$key"' EXIT
        [ -n "$RELEASE_SIGNING_KEY" ]
        (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
        ssh-keygen -Y sign -f "$key" -n qualitylayer-release stage/provenance.json
        printf 'release@qualitylayer.dev namespaces="qualitylayer-release" %s\n' "$RELEASE_SIGNER" > "$RUNNER_TEMP/allowed-signers"
        ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed-signers" -I release@qualitylayer.dev -n qualitylayer-release -s stage/provenance.json.sig < stage/provenance.json
    - name: 'Stage only reviewed export members: payload-signature'
      if: success()
      shell: bash
      env:
        QL_EXPORT_SOURCE: stage/provenance.json.sig
        QL_EXPORT_DESTINATION: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-payload-authorization-3"
        QL_EXPORT_KIND: payload-signature
        QL_EXPORT_VERSION: "${{ inputs.version }}"
      run: python3 "${{ github.workspace }}/.github/scripts/stage-release-artifact.py"
        --kind "$QL_EXPORT_KIND" --source "$QL_EXPORT_SOURCE" --destination "$QL_EXPORT_DESTINATION"
        --version "$QL_EXPORT_VERSION"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: memory-payload-signature-${{ github.run_attempt }}
        path: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-payload-authorization-3"
        retention-days: 7
      if: success()
    if: "${{ needs.private-command-preflight.result == 'success' }}"
  build:
    name: Build QualityLayer (6 targets)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - payload-authorization
    - private-command-preflight
    if: "${{ (needs.payload-authorization.result == 'success') && needs.private-command-preflight.result
      == 'success' }}"
    outputs:
      bundle_digest: "${{ steps.bundle.outputs.digest }}"
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
    - name: Install git-crypt
      run: bash .github/workflows/scripts/install-git-crypt.sh
    - name: Unlock repository
      env:
        GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}"
      run: bash .github/workflows/scripts/setup-git-crypt.sh
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.4
        no-cache: true
    - name: Install dependencies
      working-directory: qualitylayer
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/51e9c97aeb5bc217cf374406fbfdcc8d8bc7bdb703e9d245c3759db25be6381c.sh"
      env:
        QL_RELEASE_EXPORTS: "{}"
      shell: bash
    - name: Download qualified payload bytes
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: memory-payload-stage-${{ github.run_attempt }}
        path: "${{ runner.temp }}/payload-stage"
    - name: Download payload authorization
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: memory-payload-signature-${{ github.run_attempt }}
        path: "${{ runner.temp }}/payload-stage"
    - name: Build release binaries
      working-directory: qualitylayer
      env:
        QUALITYLAYER_VERSION: "${{ inputs.version }}"
        QUALITYLAYER_MEMORY_PAYLOAD_STAGE: "${{ runner.temp }}/payload-stage"
        QL_RELEASE_EXPORTS: "{}"
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/c14064e49a0fb867584923623a706d7a02ef0fcb46122e9582f94461e7cd098f.sh"
      shell: bash
    - name: The release Cockpit draws
      working-directory: qualitylayer
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/fc16efea0720bae8dbe5725c535d5b1729d4541764904ba850d141c6456cfa69.sh"
      env:
        QL_RELEASE_EXPORTS: "{}"
      shell: bash
    - name: Digest of the workflow texts
      id: bundle
      working-directory: qualitylayer
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/dd340f259a19d8e915e40dab07ca87c0d5ae6b140bb4a306b9fc04af46774f33.sh"
      env:
        QL_RELEASE_EXPORTS: '{"GITHUB_OUTPUT":{"digest":"sha256"}}'
      shell: bash
    - name: Smoke-test the Linux x64 binary
      env:
        EXPECTED: "${{ inputs.version }}"
        QL_RELEASE_EXPORTS: "{}"
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/b3f5486da14cdb51ae7ecc193c5e83364859bae4999a1a825d6601c08b40084b.sh"
      shell: bash
    - name: Collect release assets
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/cc2f5153bb640b4b6f086963714a08cff26353e85a57a400b1170895499e9cb5.sh"
      env:
        QL_RELEASE_EXPORTS: "{}"
      shell: bash
    - name: 'Stage only reviewed export members: cli'
      if: success()
      shell: bash
      env:
        QL_EXPORT_SOURCE: release/
        QL_EXPORT_DESTINATION: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-build-12"
        QL_EXPORT_KIND: cli
        QL_EXPORT_VERSION: "${{ inputs.version }}"
      run: python3 "${{ github.workspace }}/.github/scripts/stage-release-artifact.py"
        --kind "$QL_EXPORT_KIND" --source "$QL_EXPORT_SOURCE" --destination "$QL_EXPORT_DESTINATION"
        --version "$QL_EXPORT_VERSION"
    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: qualitylayer-release-cli-${{ github.run_attempt }}
        path: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-build-12"
        retention-days: 1
      if: success()
  app:
    name: App package (${{ matrix.name }})
    permissions:
      contents: read
      id-token: write
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 60
    environment: "${{ inputs.authorization_environment }}"
    needs:
    - build
    - private-command-preflight
    if: "${{ (needs.build.result == 'success') && needs.private-command-preflight.result
      == 'success' }}"
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: macos-arm64
          target: darwin-arm64
          os: macos-26
        - name: macos-x64
          target: darwin-x64
          os: macos-15-intel
        - name: windows-x64
          target: windows-x64
          os: windows-2025
        - name: linux-x64
          target: linux-x64
          os: ubuntu-22.04
        - name: linux-arm64
          target: linux-arm64
          os: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
    - name: Check out with LF line endings
      if: runner.os == 'Windows'
      run: git config --global core.autocrlf false
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: "${{ github.sha }}"
        sparse-checkout: |
          .github
          qualitylayer/app
          qualitylayer/scripts
        persist-credentials: false
    - name: Install git-crypt
      if: runner.os != 'Windows'
      run: bash .github/workflows/scripts/install-git-crypt.sh
    - name: Setup git-crypt
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
      with:
        msystem: MSYS
        install: git git-crypt
        update: true
        path-type: inherit
    - name: Unlock repository
      if: runner.os != 'Windows'
      env:
        GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}"
      run: bash .github/workflows/scripts/setup-git-crypt.sh
    - name: Unlock repository (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}"
      run: bash .github/workflows/scripts/setup-git-crypt.sh
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.4
        no-cache: true
    - name: Toolchain for the App (Rust, Tauri, the system libraries)
      uses: "./.github/actions/app-toolchain"
    - name: Import the Developer ID certificate
      if: runner.os == 'macOS'
      env:
        APPLE_CERTIFICATE: "${{ secrets.APPLE_CERTIFICATE }}"
        APPLE_CERTIFICATE_PASSWORD: "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
        QL_RELEASE_EXPORTS: "{}"
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/66d570eae7529a12b65fceeec39c0f697d2dbe6eb5f48a4d5ecc0664b80fded7.sh"
      shell: bash
    - name: Download the command line this run built
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualitylayer-release-cli-${{ github.run_attempt }}
        path: release
    - name: Windows signing
      id: signing
      if: runner.os == 'Windows'
      uses: "./.github/actions/windows-signing"
      with:
        client-id: "${{ secrets.AZURE_CLIENT_ID }}"
        tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
        subscription-id: "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
        resource-group: "${{ vars.AZURE_SIGNING_RESOURCE_GROUP }}"
        endpoint: "${{ vars.AZURE_SIGNING_ENDPOINT }}"
        account: "${{ vars.AZURE_SIGNING_ACCOUNT }}"
        profile: "${{ vars.AZURE_SIGNING_PROFILE }}"
    - name: Sign the standalone Windows CLI
      if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
      shell: pwsh
      env:
        VERSION: "${{ inputs.version }}"
        QL_RELEASE_EXPORTS: "{}"
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        pwsh "${{ github.workspace }}/.github/private-workflows/release-commands/636df6b6965729f6fb4bf372c6e787892df4acaf1fd195b31d371d84112a44f3.ps1"
    - name: Use TCP for Apple ticket delivery on Intel runners
      if: matrix.os == 'macos-15-intel'
