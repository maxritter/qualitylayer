      run: |
        set -euo pipefail
        [[ "$VERSION" =~ ^(1[2-9]|[2-9][0-9]|[1-9][0-9]{2,})\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
        expected=()
        for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64.exe; do
          expected+=("qualitylayer-$target" "qualitylayer-$target.sha256")
        done
        for script in install.sh install.ps1; do expected+=("$script" "$script.sha256"); done
        for arch in arm64 x64; do
          expected+=("QualityLayer-$VERSION-macos-$arch.dmg" "QualityLayer-$VERSION-macos-$arch.dmg.sha256" "QualityLayer-$VERSION-macos-$arch.app.tar.gz" "QualityLayer-$VERSION-macos-$arch.app.tar.gz.sig")
          package="QualityLayer-$VERSION-linux-$arch.AppImage"
          expected+=("$package" "$package.sha256" "$package.sig")
        done
        package="QualityLayer-$VERSION-x64-setup.exe"
        expected+=("$package" "$package.sha256" "$package.sig")
        expected+=(latest.json)
        printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets"
        [ -z "$(find release -mindepth 1 -maxdepth 1 ! -type f -print)" ]
        [ -z "$(find release -type f -size +1G -print)" ]
        find release -mindepth 1 -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets"
        diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"
        jq -e --arg version "$VERSION" '.version == $version' release/latest.json
        (cd release && sha256sum -c ./*.sha256)
