name: Diagnose Windows 12.0 baseline

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnostic only — published Windows baseline
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.4.2"
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-windows-x64.zip
      - name: Unlock the trusted diagnostic source
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'git-crypt.key'
          [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:GIT_CRYPT_KEY))
          try { bun .github/workflows/scripts/git-crypt-unlock.ts $key } finally { Remove-Item -LiteralPath $key -Force }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install the trusted diagnostic dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download the authentic published baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'previous-12.0.0'
          New-Item -ItemType Directory -Path $previous -ErrorAction Stop | Out-Null
          gh release download v12.0.0 --repo maxritter/qualitylayer --pattern qualitylayer-windows-x64.exe --pattern QualityLayer-12.0.0-x64-setup.exe --pattern install.ps1 --pattern SHA256SUMS --pattern SHA256SUMS.sig --dir $previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify signature and hashes, then capture the original baseline installer outcome
        run: |
          bun qualitylayer/scripts/diagnose-windows-baseline.ts --previous-dir (Join-Path $env:RUNNER_TEMP 'previous-12.0.0') --out (Join-Path $env:RUNNER_TEMP 'windows-baseline-diagnostic')
          exit $LASTEXITCODE
      - name: Preserve the diagnostic, including a failed installer outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-baseline-diagnostic-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-baseline-diagnostic/
          retention-days: 7
          if-no-files-found: warn
