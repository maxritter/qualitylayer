name: supply-chain

# The release workflow waits for this check (by name) on the release commit.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  supply-chain:
    name: supply-chain
    permissions:
      contents: read
      # Only the nightly failure handler opens an issue.
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      # What the public repository serves: nothing under qualitylayer/ in plaintext.
      - name: Plaintext guard
        run: bash .github/scripts/check_qualitylayer_encrypted.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # package.json and bun.lock are plaintext on purpose, so this runs on the locked tree.
      - name: Lockfile is complete and unchanged
        working-directory: qualitylayer
        run: bun install --frozen-lockfile --ignore-scripts

      # GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 can run out of stack on a deeply nested glob
      # pattern, and 3.0.3 is still its latest release. It is a dependency of development tools
      # only (@tailwindcss/cli's file watcher and the shadcn CLI, through micromatch); they hand
      # it this repository's own patterns, never input from outside, and none of it is in the
      # shipped binary. Max accepted that on 2026-10-03. Drop the --ignore once braces ships a fix.
      - name: Known vulnerabilities in dependencies
        working-directory: qualitylayer
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      - name: Open issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Supply-chain: nightly scan failed (${new Date().toISOString().slice(0,10)})`,
              body: `Nightly supply-chain scan failed for ${context.sha}. See workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security', 'supply-chain']
            });
