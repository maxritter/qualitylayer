        bash "${{ github.workspace }}/.github/private-workflows/release-commands/51e9c97aeb5bc217cf374406fbfdcc8d8bc7bdb703e9d245c3759db25be6381c.sh"
      working-directory: qualitylayer
      env:
        QL_RELEASE_EXPORTS: "{}"
      shell: bash
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualitylayer-candidate-assets-${{ github.run_attempt }}
        path: release
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: qualitylayer-candidate-catalog-${{ github.run_attempt }}
        path: release
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: memory-payload-stage-${{ github.run_attempt }}
        path: payload-stage
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: memory-payload-signature-${{ github.run_attempt }}
        path: payload-stage
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: memory-distribution-*-${{ github.run_attempt }}
        path: distribution
        merge-multiple: true
    - name: Validate all five final native receipts without touching public assets
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/0b633415bc73cf9ae673ba229c564d980ca3c94eacdc51ff62f3507df82cc929.sh"
      env:
        QL_RELEASE_EXPORTS: "{}"
      shell: bash
    - name: Bind immutable artifact IDs and Root-installable file hashes
      id: manifest
      env:
        VERSION: "${{ inputs.version }}"
        ASSETS_ID: "${{ needs.assemble-release.outputs.artifact_id }}"
        ASSETS_DIGEST: "${{ needs.assemble-release.outputs.artifact_digest }}"
        CATALOG_ID: "${{ needs.catalog-signing.outputs.artifact_id }}"
        CATALOG_DIGEST: "${{ needs.catalog-signing.outputs.artifact_digest }}"
        BUNDLE_DIGEST: "${{ needs.build.outputs.bundle_digest }}"
        QL_RELEASE_EXPORTS: '{"GITHUB_OUTPUT":{"sha256":"sha256"}}'
      run: python3 "${{ github.workspace }}/.github/scripts/release-private-command.py"
        bash "${{ github.workspace }}/.github/private-workflows/release-commands/c51ea24c4ffb07c8aada7ca5f5339e0e1edcb8c9f01666b6551382b6e30752f3.sh"
      shell: bash
    - name: 'Stage only reviewed export members: manifest'
      if: success()
      shell: bash
      env:
        QL_EXPORT_SOURCE: "${{ runner.temp }}/candidate/candidate.json"
        QL_EXPORT_DESTINATION: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-distribution-readiness-12"
        QL_EXPORT_KIND: manifest
        QL_EXPORT_VERSION: "${{ inputs.version }}"
      run: python3 "${{ github.workspace }}/.github/scripts/stage-release-artifact.py"
        --kind "$QL_EXPORT_KIND" --source "$QL_EXPORT_SOURCE" --destination "$QL_EXPORT_DESTINATION"
        --version "$QL_EXPORT_VERSION"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: qualitylayer-candidate-manifest-${{ github.run_attempt }}
        path: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-distribution-readiness-12"
        retention-days: 7
      if: success()
    - name: 'Stage only reviewed export members: candidate-receipts'
      if: success()
      shell: bash
      env:
        QL_EXPORT_SOURCE: distribution
        QL_EXPORT_DESTINATION: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-distribution-readiness-13"
        QL_EXPORT_KIND: candidate-receipts
        QL_EXPORT_VERSION: "${{ inputs.version }}"
        QL_DISTRIBUTION_SET: "${{ runner.temp }}/distribution-set.json"
      run: python3 "${{ github.workspace }}/.github/scripts/stage-release-artifact.py"
        --kind "$QL_EXPORT_KIND" --source "$QL_EXPORT_SOURCE" --destination "$QL_EXPORT_DESTINATION"
        --version "$QL_EXPORT_VERSION" --distribution-set "$QL_DISTRIBUTION_SET"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: qualitylayer-candidate-receipts-${{ github.run_attempt }}
        path: "${{ runner.temp }}/ql-public-upload-qualitylayer-candidate-distribution-readiness-13"
        retention-days: 7
      if: success()
    if: "${{ needs.private-command-preflight.result == 'success' }}"
  private-command-preflight:
    name: Private command channel preflight (${{ matrix.target }})
    needs: validate-inputs
    permissions:
      contents: read
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: darwin-arm64
          os: macos-26
          arch: arm64
        - target: darwin-x64
          os: macos-15-intel
          arch: x64
        - target: linux-x64
          os: ubuntu-22.04
          arch: x64
        - target: linux-arm64
          os: ubuntu-24.04-arm
          arch: arm64
        - target: win32-x64
          os: windows-2025
          arch: x64
    steps:
    - name: Checkout only public control scripts
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: "${{ github.sha }}"
        persist-credentials: false
        sparse-checkout: ".github/scripts"
    - name: Qualify actual POSIX private command channels and cleanup
      if: runner.os != 'Windows'
      shell: bash
      run: python3 "$GITHUB_WORKSPACE/.github/scripts/canary-private-command.py" "$GITHUB_WORKSPACE/.github/scripts/release-private-command.py"
      env:
        QL_CANARY_ONLY: ''
        PYTHONPATH: ''
        QL_CANARY_TRACE_PATH: ''
    - name: Qualify actual Windows PowerShell channels and owned cleanup
      if: runner.os == 'Windows'
      shell: pwsh
      run: python "$env:GITHUB_WORKSPACE/.github/scripts/canary-private-command.py"
        "$env:GITHUB_WORKSPACE/.github/scripts/release-private-command.py"
      env:
        QL_CANARY_ONLY: ''
        PYTHONPATH: ''
        QL_CANARY_TRACE_PATH: ''
    - name: Set up the actual pinned Windows MSYS2 toolchain
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
      with:
        msystem: MSYS
        install: git git-crypt
        update: true
        path-type: inherit
    - name: Qualify actual Windows MSYS2 channels and native failures
      if: runner.os == 'Windows'
      shell: pwsh
      run: python "$env:GITHUB_WORKSPACE/.github/scripts/canary-private-command.py"
        "$env:GITHUB_WORKSPACE/.github/scripts/release-private-command.py" msys2
      env:
        QL_CANARY_ONLY: ''
        PYTHONPATH: ''
        QL_CANARY_TRACE_PATH: ''
'on':
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      authorization_environment:
        required: true
        type: string
      release_authorization:
        required: false
        type: string
        default: ''
    secrets:
      GIT_CRYPT_KEY:
        required: true
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      RELEASE_SIGNING_KEY:
        required: true
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
    outputs:
      bundle_digest:
        value: "${{ jobs.build.outputs.bundle_digest }}"
      candidate_manifest_sha256:
        value: "${{ jobs.distribution-readiness.outputs.manifest_sha256 }}"
