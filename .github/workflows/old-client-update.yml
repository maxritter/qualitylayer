---
name: Old client update

# Installs real released QualityLayer versions with their own installers, then runs their
# `qualitylayer update` against live GitHub: each must land on the newest stable release.
# Standalone 12.x accepts only v12 tags and needs one explicit-version migration when Latest is 14.x.
# 13.0.0 accepts the current Latest; later clients enumerate releases. Exercise each supported path.
# Each run installs from scratch, which starts a trial on the live backend per version and runner.

"on":
  workflow_dispatch:
    inputs:
      versions:
        description: Released versions to start from, space-separated
        required: false
        type: string
        default: "12.0.0 12.9.0 12.10.1 13.0.0"

permissions:
  contents: read

concurrency:
  group: old-client-update
  cancel-in-progress: true

jobs:
  update:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERSIONS: ${{ inputs.versions || '12.0.0 12.9.0 12.10.1 13.0.0' }}
      # These old clients cannot discover a 14.x Latest; the supported one-time migration is explicit.
      EXPLICIT_VERSION_ONLY: "12.0.0 12.9.0 12.10.1"
    steps:
      - name: Newest stable release
        shell: bash
        run: |
          set -euo pipefail
          newest=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
            [.[] | select((.prerelease or .draft) | not) | .tag_name
             | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v")]
            | sort_by(split(".") | map(tonumber)) | last')
          [ -n "$newest" ]
          echo "NEWEST=$newest" >> "$GITHUB_ENV"
          echo "Every version must update to $newest"

      - name: Update from each release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          http_probe_dir="$(mktemp -d)"
          trap 'rm -f "$http_probe_dir/observed"; rmdir "$http_probe_dir" 2>/dev/null || true' EXIT
          update_diagnostic() {
            [ "$RUNNER_OS" = macOS ] || return 0
            [ ! -e "$http_probe_dir/observed" ] || return 0
            : > "$http_probe_dir/observed"
            local http_status curl_status=0
            http_status=$(curl -q --silent --max-time 15 --output /dev/null \
              --dump-header "$home/update-http.headers" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header 'User-Agent: qualitylayer-updater' \
              'https://api.github.com/repos/maxritter/qualitylayer/releases?per_page=100' \
              2> "$home/update-http-error.private") || curl_status=$?
            python3 - "$1" "$2" "$3" "$http_status" "$curl_status" "$home/update-http.headers" <<'PY'
          import json, re, sys
          from pathlib import Path

          def number(value):
              return int(value) if re.fullmatch(r"[0-9]{1,12}", value or "") else None

          def bounded(path):
              try:
                  with Path(path).open("rb") as stream:
                      return stream.read(65536)
              except OSError:
                  return b""

          headers = {}
          for line in bounded(sys.argv[6]).decode("latin-1").splitlines():
              name, separator, value = line.partition(":")
              if separator:
                  headers[name.lower()] = value.strip()
          status = number(sys.argv[4])
          status = status if status is not None and 100 <= status <= 599 else 0
          curl_exit = number(sys.argv[5])
          remaining = number(headers.get("x-ratelimit-remaining"))
          retry_after = number(headers.get("retry-after"))
          category = (
              "primary_rate_limit" if status == 403 and remaining == 0 else
              "retry_requested" if status in (403, 429) and retry_after is not None else
              "forbidden_unclassified" if status == 403 else
              "rate_limit_unclassified" if status == 429 else
              "request_now_succeeds" if status == 200 and curl_exit == 0 else
              "transport_unavailable" if curl_exit else "http_other"
          )
          updater_exit = number(sys.argv[2])
          original = (
              "release_list_http403" if b"the release list answered HTTP 403" in bounded(sys.argv[3]) else
              "updater_exit" if updater_exit else "up_to_date_missing"
          )
          print(json.dumps({
              "observation": "followup", "phase": "first" if sys.argv[1] == "first" else "second",
              "originalFailure": original, "updaterExit": updater_exit,
              "category": category, "httpStatus": status, "curlExit": curl_exit,
              "rateLimitRemaining": remaining, "rateLimitLimit": number(headers.get("x-ratelimit-limit")),
              "rateLimitReset": number(headers.get("x-ratelimit-reset")), "retryAfterSeconds": retry_after,
          }, separators=(",", ":")))
          PY
          }
          for v in $VERSIONS; do
            home="$(mktemp -d)"
            if (
              set -e
              # The installer refuses XDG folders outside the HOME it installs into.
              unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_CACHE_HOME XDG_STATE_HOME
              export HOME="$home" PATH="$home/.qualitylayer/bin:$PATH"
              curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/v$v/install.sh" -o "$home/install.sh"
              VERSION="$v" bash "$home/install.sh" --cli-only --non-interactive > "$home/install.log" 2>&1 ||
                { tail -20 "$home/install.log"; exit 1; }
              [ "$(qualitylayer --version | tail -1)" = "$v" ]
              update_status=0
              if [[ " $EXPLICIT_VERSION_ONLY " == *" $v "* ]]; then
                echo "Legacy $v uses the supported explicit-version migration"
                qualitylayer update --version "$NEWEST" > "$home/update-first.private" 2>&1 || update_status=$?
              else
                qualitylayer update > "$home/update-first.private" 2>&1 || update_status=$?
              fi
              if [ "$update_status" -ne 0 ]; then
                update_diagnostic first "$update_status" "$home/update-first.private"
                echo "::error::update from $v failed"
                exit 1
              fi
              got="$(qualitylayer --version | tail -1)"
              [ "$got" = "$NEWEST" ] || { echo "::error::$v updated to $got, not $NEWEST"; exit 1; }
              update_status=0
              qualitylayer update > "$home/update-second.private" 2>&1 || update_status=$?
              if [ "$update_status" -ne 0 ] || ! grep -q "up to date" "$home/update-second.private"; then
                update_diagnostic second "$update_status" "$home/update-second.private"
                echo "::error::a second update from $v did not settle"
                exit 1
              fi
              echo "$v -> $got"
            ); then :; else
              echo "::error::update from $v failed on $RUNNER_OS $RUNNER_ARCH"
              failed=1
            fi
            rm -rf "$home"
          done
          exit "$failed"

      - name: Update from each release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($v in ($env:VERSIONS -split '\s+' | Where-Object { $_ })) {
            # Inside the runner's own profile: the installer refuses a HOME with a shared ACL.
            $userHome = Join-Path $env:USERPROFILE "ql-homes\$v"
            New-Item -ItemType Directory -Force -Path $userHome | Out-Null
            $saved = @{ HOME = $env:HOME; USERPROFILE = $env:USERPROFILE }
            try {
              $env:HOME = $userHome
              $env:USERPROFILE = $userHome
              $installer = Join-Path $userHome 'install.ps1'
              Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/v$v/install.ps1" -OutFile $installer
              & pwsh -NoProfile -ExecutionPolicy Bypass -File $installer -Version $v -CliOnly -NonInteractive *> (Join-Path $userHome 'install.log')
              if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $userHome 'install.log') -Tail 20; throw "install of $v failed" }
              $ql = Join-Path $userHome '.qualitylayer\bin\qualitylayer.exe'
              $before = (& $ql --version | Select-Object -Last 1).Trim()
              if ($before -ne $v) { throw "installed $before, not $v" }
              if (" $env:EXPLICIT_VERSION_ONLY " -like "* $v *") {
                Write-Host "Legacy $v uses the supported explicit-version migration"
                & $ql update --version $env:NEWEST
              } else {
                & $ql update
              }
              if ($LASTEXITCODE -ne 0) { throw "supported update from $v failed" }
              $got = (& $ql --version | Select-Object -Last 1).Trim()
              if ($got -ne $env:NEWEST) { throw "$v updated to $got, not $env:NEWEST" }
              $again = (& $ql update) -join "`n"
              if ($again -notmatch 'up to date') { throw "a second update from $v did not settle: $again" }
              Write-Host "$v -> $got"
            } catch {
              Write-Host "::error::update from $v failed on Windows: $_"
              $failed = $true
            } finally {
              $env:HOME = $saved.HOME
              $env:USERPROFILE = $saved.USERPROFILE
            }
          }
          if ($failed) { exit 1 }
