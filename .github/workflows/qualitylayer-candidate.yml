        (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
        ssh-keygen -Y sign -f "$key" -n qualitylayer-release release/SHA256SUMS
        printf 'release@qualitylayer.dev namespaces="qualitylayer-release" %s\n' "$RELEASE_SIGNER" > "$RUNNER_TEMP/allowed-signers"
        ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed-signers" -I release@qualitylayer.dev -n qualitylayer-release -s release/SHA256SUMS.sig < release/SHA256SUMS
        mkdir "$RUNNER_TEMP/catalog"
        cp release/SHA256SUMS release/SHA256SUMS.sig "$RUNNER_TEMP/catalog/"
    - name: 'Stage only reviewed export members: catalog'
      if: success()
      shell: bash
