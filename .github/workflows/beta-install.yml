name: Beta install

# A clean install of the published beta on Linux, from an empty home, the way a tester
# runs it. The Release run calls it after each beta is published (a dispatch needs the
# file on the default branch, which `dev` is not); its log is the evidence (the version
# and the installed skills). It needs nothing from the repository. It installs the version it
# is given and fails when the installed binary reports another one, so a run cannot pass on an
# older beta that the installer happened to pick.

on:
  workflow_call:
    inputs:
      version:
        description: The released version to install and expect, e.g. 12.0.0-beta.9
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: The released version to install and expect, e.g. 12.0.0-beta.9
        required: true
        type: string
      signed_windows_scanners:
        description: Qualify published 14.3.0 scanner recovery on dev
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  clean-install:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.signed_windows_scanners != true }}
    name: Clean install (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install from qualitylayer.dev into an empty home
        env:
          WANTED: ${{ inputs.version }}
        run: |
          WANTED="${WANTED#v}"
          qlHome="$(mktemp -d)"
          export HOME="$qlHome" USERPROFILE="$qlHome" QUALITYLAYER_HOME="$qlHome/.qualitylayer"
          export XDG_CONFIG_HOME="$qlHome/.config" XDG_DATA_HOME="$qlHome/.local/share" XDG_CACHE_HOME="$qlHome/.cache"
          export APPDATA="$qlHome/AppData/Roaming" LOCALAPPDATA="$qlHome/AppData/Local"
          export TMPDIR="$qlHome/tmp" TMP="$qlHome/tmp" TEMP="$qlHome/tmp"
          unset CLAUDE_CONFIG_DIR CODEX_HOME PI_CODING_AGENT_DIR OPENCODE_CONFIG_DIR
          mkdir -p "$qlHome/tmp"
          # A tester has the agents installed: the installer adds its skills to each one it finds.
          mkdir -p "$HOME/.claude" "$HOME/.codex"
          curl -fsSL https://qualitylayer.dev/install.sh | VERSION="$WANTED" bash

          echo "--- version"
          INSTALLED="$("$HOME/.qualitylayer/bin/qualitylayer" --version)"
          echo "$INSTALLED"
          if [ "$INSTALLED" != "$WANTED" ]; then
            echo "::error::installed '${INSTALLED}', expected the released '${WANTED}'"
            exit 1
          fi
          echo "--- installed skills"
          for skill in ql-workflow ql-artifact ql-peer ql-manage; do
            test -f "$HOME/.claude/skills/$skill/SKILL.md"
            test -f "$HOME/.agents/skills/$skill/SKILL.md"
            grep -q 'allow_implicit_invocation: true' "$HOME/.agents/skills/$skill/agents/openai.yaml"
            echo "$skill"
          done
          test ! -e "$HOME/.claude/skills/ql"
          test ! -e "$HOME/.agents/skills/ql"

  windows-install:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.signed_windows_scanners != true }}
    name: Clean native Windows install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    steps:
      - name: Install the published Windows release into an empty home
        shell: pwsh
        env:
          WANTED: ${{ inputs.version }}
        run: |
          $qlWanted = $env:WANTED -replace '^v', ''
          $qlParent = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Temp'
          $qlHome = Join-Path $qlParent ("qualitylayer-beta-" + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $qlHome -ErrorAction Stop | Out-Null
          $qlSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $qlHome /inheritance:r /grant:r "*${qlSid}:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' /q
          if ($LASTEXITCODE -ne 0) { throw 'Private Windows beta account ACL protection failed' }
          New-Item -ItemType Directory -Path "$qlHome/.claude", "$qlHome/.codex" -Force | Out-Null
          $env:HOME = $qlHome
          $env:USERPROFILE = $qlHome
          $env:QUALITYLAYER_HOME = Join-Path $qlHome '.qualitylayer'
          $env:APPDATA = Join-Path $qlHome 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $qlHome 'AppData/Local'
          $env:XDG_CONFIG_HOME = Join-Path $qlHome '.config'
          $env:XDG_DATA_HOME = Join-Path $qlHome '.local/share'
          $env:XDG_CACHE_HOME = Join-Path $qlHome '.cache'
          $env:TMPDIR = Join-Path $qlHome 'tmp'
          $env:TMP = $env:TMPDIR
          $env:TEMP = $env:TMPDIR
          New-Item -ItemType Directory -Path $env:TMPDIR -Force | Out-Null
          foreach ($name in @('CLAUDE_CONFIG_DIR','CODEX_HOME','PI_CODING_AGENT_DIR','OPENCODE_CONFIG_DIR')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $env:QUALITYLAYER_API_BASE = 'http://127.0.0.1:9'
          $env:POLAR_API_BASE = 'http://127.0.0.1:9'
          $qlScript = [ScriptBlock]::Create((Invoke-WebRequest 'https://qualitylayer.dev/install.ps1').Content)
          & $qlScript -Version $qlWanted -NonInteractive
          $qlBinary = Join-Path $qlHome '.qualitylayer/bin/qualitylayer.exe'
          $qlActual = & $qlBinary --version
          if ($LASTEXITCODE -ne 0 -or $qlActual.Trim() -ne $qlWanted) { throw "Expected $qlWanted, got $qlActual" }
          foreach ($qlName in @('ql-workflow', 'ql-artifact', 'ql-peer', 'ql-manage')) {
            foreach ($qlSkill in @("$qlHome/.claude/skills/$qlName/SKILL.md", "$qlHome/.agents/skills/$qlName/SKILL.md")) {
              if (-not (Test-Path $qlSkill)) { throw "Missing installed skill: $qlSkill" }
            }
            $qlPolicy = Get-Content -Raw "$qlHome/.agents/skills/$qlName/agents/openai.yaml"
            if ($qlPolicy -notmatch 'allow_implicit_invocation: true') { throw "Natural-language skill invocation disabled: $qlName" }
          }
          foreach ($qlRetired in @("$qlHome/.claude/skills/ql", "$qlHome/.agents/skills/ql")) {
            if (Test-Path $qlRetired) { throw "Retired duplicate skill: $qlRetired" }
          }
          & $qlBinary uninstall --purge --json
          if ($LASTEXITCODE -ne 0 -or (Test-Path "$qlHome/.qualitylayer")) { throw 'Published Windows uninstall failed' }

  signed-windows-scanners:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'maxritter/qualitylayer' && github.ref == 'refs/heads/dev' && inputs.signed_windows_scanners == true }}
    name: Published Windows scanner recovery
    permissions: {}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Hold the Qlty stage open during signed scanner setup
        shell: pwsh
        env:
          WANTED: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $phase = 'version'
          $root = $null
          $process = $null
          $handle = $null
          $failed = $false
          $stageSeen = $false
          $openError = 0

          function Read-ScannerStates {
            $logPath = Join-Path $env:QUALITYLAYER_HOME 'quality-setup.log'
            $last = Get-Content -LiteralPath $logPath -Tail 1 | ConvertFrom-Json
            $toolNames = [ordered] @{
              qlty = 'Qlty 0.657.0 '
              betterleaks = 'Betterleaks 1.9.0 '
              'osv-scanner' = 'OSV-Scanner 2.7.0 '
              zizmor = 'Zizmor 1.31.1 '
              opengrep = 'OpenGrep 1.31.0 '
            }
            $states = [ordered] @{}
            foreach ($id in $toolNames.Keys) {
              $prefix = $toolNames[$id]
              $rows = @($last.tools | Where-Object { $_.StartsWith($prefix, [StringComparison]::Ordinal) })
              $state = 'missing-or-duplicate'
              $category = $null
              if ($rows.Count -eq 1) {
                $detail = $rows[0].Substring($prefix.Length)
                if ($detail -match '^(ready|unsupported|failed|not recorded)(?:$|:)') { $state = $Matches[1] }
                if ($state -eq 'failed') {
                  $category = switch -Regex ($detail) {
                    'Unsafe directory ACL' { 'directory-acl-unsafe'; break }
                    'Directory ACL evidence' { 'directory-acl-evidence'; break }
                    'Unsafe directory entry' { 'directory-entry'; break }
                    'outside (?:isolated )?HOME|cannot verify native configuration' { 'isolated-profile-boundary'; break }
                    'download (?:SHA256|exceeds its byte)' { 'download-integrity'; break }
                    '(?:download answered HTTP|download exceeded its time|network|certificate)' { 'download-transport'; break }
                    '(?:archive layout|member|archive extraction)' { 'archive-layout'; break }
                    '(?:failed integrity or version verification|executable is missing or oversized)' { 'executable-verification'; break }
                    '(?:EPERM|EACCES|EBUSY)' { 'filesystem-refusal'; break }
                    default { 'unclassified' }
                  }
                }
              }
              $states[$id] = @{ state = $state; category = $category }
            }
            return @{
              complete = [bool] $last.complete
              tools = $states
              scannerManifestRefused = [bool] ($last.tools -like 'scanners not recorded: *')
            }
          }

          function Test-InstalledVersion([string] $binary, [string] $argument, [string] $wanted) {
            $versionOut = Join-Path $root 'managed-version.log'
            $versionErr = Join-Path $root 'managed-version.stderr'
            $worker = $null
            try {
              $worker = Start-Process -FilePath $binary -ArgumentList $argument -PassThru `
                -RedirectStandardOutput $versionOut -RedirectStandardError $versionErr -WorkingDirectory $root
              if (-not $worker.WaitForExit(10000)) { return 'timed-out' }
              if ($worker.ExitCode -ne 0) { return 'nonzero' }
              if ((Get-Content -Raw -LiteralPath $versionOut).Contains($wanted)) { return 'verified' }
              return 'unexpected-version'
            } catch {
              return 'unavailable'
            } finally {
              if ($null -ne $worker -and -not $worker.HasExited) {
                $worker.Kill($true)
                if (-not $worker.WaitForExit(10000)) { throw 'Version process did not stop' }
              }
            }
          }

          function Get-InstalledFacts {
            $pins = [ordered] @{
              qlty = @('0.657.0', '071bf94a171230fa70703b26704ea64044cb0aa8dc45e30c2298dbeacd2cd3e1',
                '482131b13bc5d4fefb08dba6a69467b82071b869312e5b7f3b0373caf5938e29', '--version', 'qlty 0.657.0')
              betterleaks = @('1.9.0', 'b765daec9fda475b031b5a5159798cbe4294a3f2a50683cbc0471226e376d3da',
                '41a3dc5e75712d52d25aa7203b0b6bc2fa9c796fe5109d3835c60226a9a69352', 'version', '1.9.0')
              'osv-scanner' = @('2.7.0', '9964ed64ec9a387391eb4cc006ad5c531154821aef29b793e02c448de4686438',
                $null, '--version', 'osv-scanner version: 2.7.0')
              zizmor = @('1.31.1', '4de30371c8a3b483aecbcf0dec1fd6a2b6aae65051ca226b4f6527baac6a8c7a',
                '320dbd80365cce71200f31d7b2e6148c7ea0ea950ef2661d74d18f308d6f4148', '--version', 'zizmor 1.31.1')
              opengrep = @('1.31.0', 'fdd2e22549e7000ceb66976a01366db6910760b2aa4e457b6bda62545070d26a',
                $null, '--version', '1.31.0')
            }
            $results = [ordered] @{}
            $manifest = Get-Content -Raw -LiteralPath (Join-Path $env:QUALITYLAYER_HOME 'manifest.json') -ErrorAction SilentlyContinue
            $entries = if ($manifest) { ($manifest | ConvertFrom-Json).entries } else { @() }
            foreach ($id in $pins.Keys) {
              $pin = $pins[$id]
              $binaryHash = $pin[2] ?? $pin[1]
              $dir = Join-Path $env:QUALITYLAYER_HOME ("tools\$id\" + $pin[0] + "\$target")
              $binary = Join-Path $dir "$id.exe"
              $found = [ordered] @{
                expectedVersion = $pin[0]; expectedBinarySha256 = $binaryHash; expectedAssetSha256 = $pin[1]
                present = $false; binaryHashMatched = $false; receiptPinMatched = $false
                manifestBinaryRecorded = $false; version = 'missing'
              }
              if (Test-Path -LiteralPath $binary -PathType Leaf) {
                $found.present = $true
                $entry = Get-Item -LiteralPath $binary
                if (($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
                  $found.binaryHashMatched = (Get-FileHash -LiteralPath $binary).Hash -eq $binaryHash
                }
                $found.version = 'unverified-file'
                if ($found.binaryHashMatched) {
                  $found.manifestBinaryRecorded = @($entries | Where-Object { $_.kind -eq 'file' -and $_.path -eq $binary -and $_.sha256 -eq $binaryHash }).Count -eq 1
                  $receiptPath = Join-Path $dir 'receipt.json'
                  if (Test-Path -LiteralPath $receiptPath -PathType Leaf) {
                    try {
                      $receipt = Get-Content -Raw -LiteralPath $receiptPath | ConvertFrom-Json
                      $asset = if ($id -eq 'qlty') { $receipt.archiveSha256 } else { $receipt.assetSha256 }
                      $found.receiptPinMatched = $receipt.schema -eq 1 -and $receipt.target -eq $target -and
                        $receipt.version -eq $pin[0] -and $asset -eq $pin[1] -and $receipt.binarySha256 -eq $binaryHash
                    } catch { }
                  }
                  $found.version = Test-InstalledVersion $binary $pin[3] $pin[4]
                }
              }
              $results[$id] = $found
            }
            return $results
          }

          function Read-SetupResult([Diagnostics.Process] $child, [string] $output, [int] $seconds) {
            if (-not $child.WaitForExit($seconds * 1000) -or $child.ExitCode -ne 0) {
              throw 'CLI did not finish successfully'
            }
            $data = Get-Content -Raw -LiteralPath $output | ConvertFrom-Json
            if ($data.ok -ne $true) { throw 'CLI did not report success' }
            return $data
          }

          try {
            if ($env:WANTED -cne '14.3.0') { throw 'Expected 14.3.0' }
            $phase = 'private-home'
            $qaParent = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Temp'
            if (-not (Test-Path -LiteralPath $qaParent -PathType Container)) { throw 'Missing account temp root' }
            $root = Join-Path $qaParent ('ql-scanners-' + [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $root | Out-Null
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User
            $acl = [Security.AccessControl.DirectorySecurity]::new()
            $acl.SetAccessRuleProtection($true, $false)
            $rule = [Security.AccessControl.FileSystemAccessRule]::new(
              $sid, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow'
            )
            $acl.SetOwner($sid)
            $acl.SetAccessRule($rule)
            Set-Acl -Path $root -AclObject $acl
            $acl = Get-Acl -LiteralPath $root
            $rules = $acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])
            if (-not $acl.AreAccessRulesProtected -or $rules.Count -ne 1 -or
                $rules[0].IdentityReference.Value -ne $sid.Value -or $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value -ne $sid.Value) {
              throw 'Unexpected ACL'
            }

            $env:HOME = Join-Path $root 'home'
            $env:USERPROFILE = $env:HOME
            $env:QUALITYLAYER_HOME = Join-Path $env:HOME '.qualitylayer'
            $env:APPDATA = Join-Path $env:HOME 'AppData\Roaming'
            $env:LOCALAPPDATA = Join-Path $env:HOME 'AppData\Local'
            $env:XDG_CONFIG_HOME = Join-Path $env:HOME '.config'
            $env:XDG_DATA_HOME = Join-Path $env:HOME '.local\share'
            $env:XDG_CACHE_HOME = Join-Path $env:HOME '.cache'
            $env:TEMP = Join-Path $env:HOME 'tmp'
            $env:TMP = $env:TEMP
            $env:TMPDIR = $env:TEMP
            foreach ($name in @('CLAUDE_CONFIG_DIR', 'CODEX_HOME', 'PI_CODING_AGENT_DIR', 'OPENCODE_CONFIG_DIR', 'GROK_HOME', 'COPILOT_HOME')) {
              Remove-Item "Env:$name" -ErrorAction SilentlyContinue
            }
            $env:QUALITYLAYER_API_BASE = 'http://127.0.0.1:9'
            $env:POLAR_API_BASE = 'http://127.0.0.1:9'
            $target = 'x86_64-pc-windows-msvc'
            $parent = Join-Path $env:QUALITYLAYER_HOME 'tools\qlty\0.657.0'
            New-Item -ItemType Directory -Path $env:TEMP, $env:APPDATA, $env:LOCALAPPDATA, $parent -Force | Out-Null
            Set-Location -LiteralPath $root

            $phase = 'signed-cli'
            $cli = Join-Path $root 'qualitylayer-windows-x64.exe'
            $digest = '8d15c96946b8c23c49f575c8b22998362971964889630fb5203ec4ccb7fde143'
            Invoke-WebRequest -Uri 'https://github.com/maxritter/qualitylayer/releases/download/v14.3.0/qualitylayer-windows-x64.exe' -OutFile $cli -TimeoutSec 120
            $signer = 'B59EA06417CE98E7631BB78F561F8F644BDA0CE2'
            $signature = Get-AuthenticodeSignature -LiteralPath $cli
            if ((Get-FileHash -LiteralPath $cli).Hash -ne $digest -or $signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Thumbprint -ne $signer -or -not $signature.TimeStamperCertificate) {
              throw 'CLI identity mismatch'
            }
            $reported = & $cli --version 2>$null
            if ($LASTEXITCODE -ne 0 -or $reported -cne '14.3.0') { throw 'CLI version mismatch' }

            $phase = 'native-handle'
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using Microsoft.Win32.SafeHandles;
          public static class ScannerStageHandle {
              // Share reading and writing, but withhold DELETE access needed for rename.
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true, ExactSpelling = true)]
              private static extern SafeFileHandle CreateFileW(string path, uint access, uint share,
                  IntPtr security, uint disposition, uint flags, IntPtr template);

              public static SafeFileHandle OpenDirectory(string path, bool read) {
                  const uint listDirectory = 0x0001;
                  const uint shareReadWrite = 0x0003;
                  const uint openExisting = 3;
                  const uint backupSemantics = 0x02000000;
                  return CreateFileW(path, read ? listDirectory : 0, shareReadWrite,
                      IntPtr.Zero, openExisting, backupSemantics, IntPtr.Zero);
              }
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true, ExactSpelling = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              public static extern bool MoveFileW(string source, string destination);

              public static int RenameError(string source, string destination) {
                  return MoveFileW(source, destination) ? 0 : Marshal.GetLastWin32Error();
              }
          }
          '@

            $phase = 'control-create'
            $sample = Join-Path $root 'control'
            $moved = Join-Path $root 'control-renamed'
            New-Item -ItemType Directory -Path $sample | Out-Null
            $controlFile = Join-Path $sample 'input.txt'
            Set-Content -LiteralPath $controlFile -Value 'fixture'
            $phase = 'control-metadata-only'
            $handle = [ScannerStageHandle]::OpenDirectory($sample, $false)
            if ($handle.IsInvalid) { throw 'Metadata-only open failed' }
            $metadataOnlyRenameError = [ScannerStageHandle]::RenameError($sample, $moved)
            $handle.Dispose()
            $handle = $null
            if ($metadataOnlyRenameError -eq 0 -and [ScannerStageHandle]::RenameError($moved, $sample) -ne 0) {
              throw 'Control restore failed'
            }

            $phase = 'control-open-read'
            $handle = [ScannerStageHandle]::OpenDirectory($sample, $true)
            if ($handle.IsInvalid) { throw 'Read-sharing open failed' }
            $phase = 'control-rename-held'
            $controlRenameError = [ScannerStageHandle]::RenameError($sample, $moved)
            if ($controlRenameError -notin @(5, 32)) { throw 'Held rename permitted' }
            $phase = 'control-read-held'
            if ((Get-Content -LiteralPath $controlFile) -cne 'fixture') { throw 'Held read failed' }
            $handle.Dispose()
            $handle = $null
            $phase = 'control-rename-released'
            if ([ScannerStageHandle]::RenameError($sample, $moved) -ne 0) {
              throw 'Released rename failed'
            }

            $controlDiagnostic = @{
              metadataOnlyRenameError = $metadataOnlyRenameError
              controlRenameError = $controlRenameError
            }
            Write-Output ('WINDOWS_SCANNER_CONTROL ' + ($controlDiagnostic | ConvertTo-Json -Compress))

            $phase = 'cold-setup'
            $out = Join-Path $root 'setup.json'
            $err = Join-Path $root 'setup.stderr'
            $process = Start-Process -FilePath $cli -ArgumentList 'quality', 'setup', '--json' -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err -WorkingDirectory $root
            $timer = [Diagnostics.Stopwatch]::StartNew()
            $phase = 'stage-lock'
            $stage = $null
            while ($timer.Elapsed.TotalSeconds -lt 55 -and -not $process.HasExited) {
              $stages = @([IO.Directory]::EnumerateDirectories($parent, ".$target-*"))
              if ($stages.Count -gt 1) { throw 'Unexpected concurrent staging' }
              if ($stages.Count -eq 1) {
                $stageSeen = $true
                $stage = $stages[0]
                $handle = [ScannerStageHandle]::OpenDirectory($stage, $true)
                $openError = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
                if (-not $handle.IsInvalid) { break }
                $handle.Dispose()
                $handle = $null
              }
              Start-Sleep -Milliseconds 10
            }
            if ($null -eq $handle) { throw 'Stage not locked' }

            $phase = 'rename-denied'
            $control = Join-Path $parent 'rename-control'
            $renameError = [ScannerStageHandle]::RenameError($stage, $control)
            if ($renameError -notin @(5, 32)) { throw 'Unexpected native rename outcome' }

            $phase = 'stage-readable'
            $licensePath = Join-Path $stage 'LICENSE.md'
            $stagedReceipt = Join-Path $stage 'receipt.json'
            while ($timer.Elapsed.TotalSeconds -lt 75 -and -not $process.HasExited -and
                -not (Test-Path -LiteralPath $stagedReceipt -PathType Leaf)) {
              Start-Sleep -Milliseconds 20
            }
            $license = [IO.File]::Open($licensePath, 'Open', 'Read', 'ReadWrite,Delete')
            try {
              if ($license.ReadByte() -lt 0) { throw 'Empty staged licence' }
            } finally {
              $license.Dispose()
            }

            $phase = 'locked-setup-result'
            $setup = Read-SetupResult $process $out 240
            $coldSeconds = [Math]::Round($timer.Elapsed.TotalSeconds, 1)
            if ($setup.status -ne 'ready' -or $setup.reason -notmatch '^Qlty is ready; its temporary setup folder ' -or
                $handle.IsClosed -or
                -not (Test-Path -LiteralPath $stage -PathType Container)) { throw 'No live locked-stage recovery' }

            $phase = 'locked-receipts'
            $expected = @{ qlty = '0.657.0'; betterleaks = '1.9.0'; 'osv-scanner' = '2.7.0'; zizmor = '1.31.1'; opengrep = '1.31.0' }
            $qBinary = Join-Path $parent "$target\qlty.exe"
            $version = & $qBinary --version 2>$null
            if ($LASTEXITCODE -ne 0 -or $version -notmatch '^qlty 0\.657\.0(?:\s|$)') { throw 'Qlty unusable' }

            $receiptFiles = @{}
            $manifestPath = Join-Path $env:QUALITYLAYER_HOME 'manifest.json'
            $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
            foreach ($id in $expected.Keys) {
              $phase = "locked-receipt-$id"
              $dir = Join-Path $env:QUALITYLAYER_HOME ("tools\$id\" + $expected[$id] + "\$target")
              $receiptPath = Join-Path $dir 'receipt.json'
              $receipt = Get-Content -Raw -LiteralPath $receiptPath | ConvertFrom-Json
              $binary = Join-Path $dir "$id.exe"
              $name = if ($id -eq 'qlty') { 'LICENSE.md' } else { 'LICENSE.txt' }
              $licensePath = Join-Path $dir $name
              $licenseHash = if ($id -eq 'qlty') {
                if ($receipt.archiveSha256 -ne '071bf94a171230fa70703b26704ea64044cb0aa8dc45e30c2298dbeacd2cd3e1') {
                  throw 'Unexpected Qlty archive receipt'
                }
                $receipt.licenseSha256
              } else {
                if ($receipt.id -ne $id) { throw 'Scanner receipt mismatch' }
                $receipt.licenceSha256
              }
              if ($receipt.schema -ne 1 -or $receipt.version -ne $expected[$id] -or $receipt.target -ne $target -or
                  (Get-FileHash -LiteralPath $binary).Hash -ne $receipt.binarySha256 -or
                  (Get-FileHash -LiteralPath $licensePath).Hash -ne $licenseHash) { throw 'Installed receipt mismatch' }
              foreach ($path in @($binary, $licensePath, $receiptPath)) {
                $hash = (Get-FileHash -LiteralPath $path).Hash
                $owned = @($manifest.entries | Where-Object { $_.kind -eq 'file' -and $_.path -eq $path })
                if ($owned.Count -ne 1 -or $owned[0].sha256 -ne $hash) { throw 'Manifest mismatch' }
                $receiptFiles[$path] = $hash
              }
            }

            $phase = 'locked-status'
            $out = Join-Path $root 'status.json'
            $process = Start-Process -FilePath $cli -ArgumentList 'quality', 'status', '--json' -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err -WorkingDirectory $root
            $status = Read-SetupResult $process $out 25
            if (-not $status.installed -or $status.binary -ne $qBinary -or -not $status.setup.at -or
                $status.setup.error -or $status.scanners.Count -ne 4 -or $setup.scanners.Count -ne 4) {
              throw 'Incomplete scanner status'
            }
            foreach ($id in $expected.Keys | Where-Object { $_ -ne 'qlty' }) {
              $phase = "locked-status-$id"
              $ready = @($status.scanners | Where-Object { $_.id -eq $id -and $_.version -eq $expected[$id] -and $_.state -eq 'ready' })
              $installed = @($setup.scanners | Where-Object { $_.id -eq $id -and $_.version -eq $expected[$id] -and $_.status -eq 'ready' })
              if ($ready.Count -ne 1 -or $installed.Count -ne 1) { throw 'Pinned scanner is not ready' }
            }

            $phase = 'released-repeat'
            $handle.Dispose()
            $handle = $null
            $out = Join-Path $root 'repeat.json'
            $process = Start-Process -FilePath $cli -ArgumentList 'quality', 'setup', '--json' -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err -WorkingDirectory $root
            $repeat = Read-SetupResult $process $out 75
            $repeatIds = @($repeat.scanners.id | Sort-Object -Unique)
            if ($repeat.status -ne 'ready' -or $repeat.version -ne $expected.qlty -or
                $repeat.scanners.Count -ne 4 -or $repeatIds.Count -ne 4) { throw 'Incomplete repeat readiness' }
            foreach ($scanner in $repeat.scanners) {
              if ($scanner.id -eq 'qlty' -or $scanner.status -ne 'ready' -or $scanner.version -ne $expected[$scanner.id]) {
                throw 'Repeat scanner mismatch'
              }
            }
            foreach ($path in $receiptFiles.Keys) {
              if ((Get-FileHash -LiteralPath $path).Hash -ne $receiptFiles[$path]) { throw 'Repeat changed bytes' }
            }
            $runs = @(Get-Content -LiteralPath (Join-Path $env:QUALITYLAYER_HOME 'quality-setup.log') | ForEach-Object { ConvertFrom-Json $_ })
            if ($runs.Count -ne 2 -or @($runs | Where-Object { -not $_.complete -or $_.tools.Count -ne 5 }).Count -ne 0) {
              throw 'Missing setup records'
            }

            $result = @{
              version = '14.3.0'
              cliSha256 = $digest
              authenticode = 'valid-timestamped'
              metadataOnlyRenameError = $metadataOnlyRenameError
              nativeLockControl = $true
              controlRenameError = $controlRenameError
              nativeRenameError = $renameError
              stageReadableWhileLocked = $true
              publishedWhileLocked = $true
              installed = $expected
              verifiedReceiptFiles = $receiptFiles.Count
              coldSetupSeconds = $coldSeconds
              completedSetups = $runs.Count
            }
          } catch {
            Write-Output "WINDOWS_SCANNER_FAILURE phase=$phase"
            if ($phase -in @('stage-lock', 'locked-setup-result')) {
              $diagnostic = @{
                stageSeen = $stageSeen
                openError = [int] $openError
                elapsedMs = [int] $timer.ElapsedMilliseconds
                childExited = $process.HasExited
                childExit = if ($process.HasExited) { $process.ExitCode } else { $null }
              }
              if ($process.HasExited) {
                try { $diagnostic.scanners = Read-ScannerStates } catch { $diagnostic.scanners = $null }
                if ($phase -eq 'locked-setup-result') {
                  $diagnostic.stageStillPresent = -not $handle.IsClosed -and (Test-Path -LiteralPath $stage -PathType Container)
                  $diagnostic.actualRenameError = $renameError
                  $env:SEMGREP_SEND_METRICS = $env:OPENGREP_SEND_METRICS = 'off'
                  try { $diagnostic.installedFacts = Get-InstalledFacts } catch { $diagnostic.installedFacts = $null }
                }
              }
              Write-Output ('WINDOWS_SCANNER_DIAGNOSTIC ' + ($diagnostic | ConvertTo-Json -Depth 5 -Compress))
            }
            if ($phase -like 'control-*') {
              $controlDiagnostic = @{
                metadataOnlyRenameError = $metadataOnlyRenameError
                controlRenameError = $controlRenameError
              }
              Write-Output ('WINDOWS_SCANNER_CONTROL ' + ($controlDiagnostic | ConvertTo-Json -Compress))
            }
            $failed = $true
          } finally {
            try {
              if ($null -ne $process -and -not $process.HasExited) {
                $process.Kill($true)
                if (-not $process.WaitForExit(10000)) { throw 'CLI cleanup timed out' }
              }
              if ($null -ne $handle) { $handle.Dispose() }
              if ($null -ne $root -and (Test-Path -LiteralPath $root)) {
                Set-Location -LiteralPath $qaParent
                Remove-Item -LiteralPath $root -Recurse -Force
              }
            } catch {
              Write-Output 'WINDOWS_SCANNER_FAILURE phase=cleanup'
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          $result.cleanup = $true
          Write-Output ('WINDOWS_SCANNER_RESULT ' + ($result | ConvertTo-Json -Compress))
  signed-opengrep-diagnosis:
    needs: signed-windows-scanners
    if: ${{ failure() && needs.signed-windows-scanners.result == 'failure' }}
    name: Pinned OpenGrep Windows launch diagnosis
    permissions: {}
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Compare cold managed and ordinary native launches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $phase = 'private-root'
          $root = $null
          $failed = $false

          function Test-OpenGrep([string] $binary, [string] $temp, [bool] $managed) {
            $launch = [Diagnostics.ProcessStartInfo]::new($binary)
            $launch.ArgumentList.Add('--version')
            $launch.UseShellExecute = $false
            $launch.CreateNoWindow = $true
            $launch.WorkingDirectory = Split-Path -Parent $binary
            $launch.RedirectStandardInput = $true
            $launch.RedirectStandardOutput = $true
            $launch.RedirectStandardError = $true
            $launch.Environment.Clear()
            $keys = @('PATH', 'SystemRoot', 'SYSTEMROOT', 'WINDIR', 'LANG', 'LC_ALL')
            if (-not $managed) {
              $keys += @('COMSPEC','PROGRAMFILES','PROGRAMFILES(X86)','PROGRAMW6432','SYSTEMDRIVE','PATHEXT','OS',
                'PROGRAMDATA','USERNAME','NUMBER_OF_PROCESSORS','PROCESSOR_ARCHITECTURE')
            }
            foreach ($key in $keys) {
              $value = [Environment]::GetEnvironmentVariable($key)
              if ($null -ne $value) { $launch.Environment[$key] = $value }
            }
            if ($managed) {
              $state = Join-Path $managedHome 'tools\opengrep\state'
              $dirs = @{
                XDG_CONFIG_HOME = 'config'; XDG_CACHE_HOME = 'cache'; XDG_DATA_HOME = 'data'
                HOME = 'home'; USERPROFILE = 'home'; APPDATA = 'data'; LOCALAPPDATA = 'cache'
              }
              foreach ($key in $dirs.Keys) {
                $path = Join-Path $state $dirs[$key]
                New-Item -ItemType Directory -Path $path -Force | Out-Null
                $launch.Environment[$key] = $path
              }
              $launch.Environment['QUALITYLAYER_HOME'] = $managedHome
              $launch.Environment['QLTY_TELEMETRY'] = 'off'
              $launch.Environment['NO_COLOR'] = '1'
            } else {
              $launch.Environment['HOME'] = $isolatedHome
              $launch.Environment['USERPROFILE'] = $isolatedHome
              $launch.Environment['APPDATA'] = Join-Path $isolatedHome 'AppData\Roaming'
              $launch.Environment['LOCALAPPDATA'] = Join-Path $isolatedHome 'AppData\Local'
              $drive = [IO.Path]::GetPathRoot($isolatedHome).TrimEnd('\')
              $launch.Environment['HOMEDRIVE'] = $drive
              $launch.Environment['HOMEPATH'] = $isolatedHome.Substring($drive.Length)
            }
            foreach ($key in @('TEMP','TMP','TMPDIR')) { $launch.Environment[$key] = $temp }
            $launch.Environment['SEMGREP_SEND_METRICS'] = 'off'
            $launch.Environment['OPENGREP_SEND_METRICS'] = 'off'
            $row = @{
              binaryPathLength = $binary.Length
              tempPathLength = $temp.Length
              pathLength = $launch.Environment['PATH'].Length
              nativeCacheBefore = Test-Path -LiteralPath $nativeCache -PathType Container
              nativeCacheAfter = $false
              exitCode = $null
              elapsedMs = 0
              load = 'unavailable'
            }
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $worker = $null
            try {
              $worker = [Diagnostics.Process]::Start($launch)
              $worker.StandardInput.Close()
              $outBuffer = [char[]]::new(4097)
              $errBuffer = [char[]]::new(16385)
              $stdout = $worker.StandardOutput.ReadBlockAsync($outBuffer, 0, $outBuffer.Length)
              $stderr = $worker.StandardError.ReadBlockAsync($errBuffer, 0, $errBuffer.Length)
              while (-not $worker.WaitForExit(250)) {
                if (($stdout.IsCompletedSuccessfully -and $stdout.Result -eq $outBuffer.Length) -or
                    ($stderr.IsCompletedSuccessfully -and $stderr.Result -eq $errBuffer.Length)) {
                  $row.load = 'output-limit'
                  return $row
                }
                if ($clock.ElapsedMilliseconds -ge 60000) {
                  $row.load = 'timed-out'
                  return $row
                }
              }
              $row.exitCode = $worker.ExitCode
              if (-not $stdout.Wait(2000) -or -not $stderr.Wait(2000)) {
                $row.load = 'incomplete-output'
                return $row
              }
              $outText = [string]::new($outBuffer, 0, $stdout.Result)
              $errText = [string]::new($errBuffer, 0, $stderr.Result)
              if ([Text.Encoding]::UTF8.GetByteCount($outText) -gt 4096 -or
                  [Text.Encoding]::UTF8.GetByteCount($errText) -gt 16384) {
                $row.load = 'output-limit'
                return $row
              }
              $row.load = switch ($worker.ExitCode) {
                0 {
                  if ($outText.Contains('1.31.0')) { 'expected-version' }
                  elseif ($errText.Contains('1.31.0')) { 'version-on-stderr' }
                  else { 'unexpected-version' }
                }
                -1073741515 { 'loader-dll-missing' }
                -1073741701 { 'loader-image-invalid' }
                -1073741502 { 'loader-init-failed' }
                default {
                  switch -Regex ($errText) {
                    "couldn't runtime expand spec" { 'cache-spec'; break }
                    "couldn't unpack file|failed to open.*for writing" { 'cache-extraction'; break }
                    'load DLL|DLL entry point not found' { 'bootstrap-dll-loader'; break }
                    "couldn't launch child" { 'bootstrap-child-launch'; break }
                    default { 'nonzero' }
                  }
                }
              }
              return $row
            } catch {
              return $row
            } finally {
              $row.elapsedMs = [int] $clock.ElapsedMilliseconds
              if ($worker -and -not $worker.HasExited) {
                $worker.Kill($true)
                if (-not $worker.WaitForExit(10000)) { throw 'Version process did not stop' }
              }
              if ($worker) { $worker.Dispose() }
              $row.nativeCacheAfter = Test-Path -LiteralPath $nativeCache -PathType Container
            }
          }

          try {
            $nativeLocal = [Environment]::GetFolderPath('LocalApplicationData')
            $nativeCache = Join-Path $nativeLocal 'opengrep\v1.31.0'
            $tempParent = Join-Path $nativeLocal 'Temp'
            $root = Join-Path $tempParent ('ql-scanners-' + [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $root | Out-Null
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            icacls $root /inheritance:r /grant:r "*${sid}:(OI)(CI)F" /q *> $null
            if ($LASTEXITCODE -ne 0 -or -not (Get-Acl -LiteralPath $root).AreAccessRulesProtected) {
              throw 'Cannot verify owned fixture ACL'
            }
            $isolatedHome = Join-Path $root 'home'
            $managedHome = Join-Path $isolatedHome '.qualitylayer'
            $fixtureTemp = Join-Path $isolatedHome 'tmp'
            $shortTemp = Join-Path $root 't'
            $stage = Join-Path $managedHome 'tools\opengrep\1.31.0\.x86_64-pc-windows-msvc-probeX'
            New-Item -ItemType Directory -Path $fixtureTemp, $shortTemp, $stage, "$isolatedHome\AppData\Roaming", "$isolatedHome\AppData\Local" -Force | Out-Null

            $phase = 'pinned-public-asset'
            $hash = 'fdd2e22549e7000ceb66976a01366db6910760b2aa4e457b6bda62545070d26a'
            $shortExe = Join-Path $root 'opengrep.exe'
            $stagedExe = Join-Path $stage 'opengrep.exe'
            Invoke-WebRequest -Uri 'https://github.com/opengrep/opengrep/releases/download/v1.31.0/opengrep_windows_x86.exe' -OutFile $shortExe -TimeoutSec 40
            if ((Get-Item -LiteralPath $shortExe).Length -ne 53677568 -or (Get-FileHash -LiteralPath $shortExe).Hash -ne $hash) {
              throw 'Published asset hash mismatch'
            }
            Copy-Item -LiteralPath $shortExe -Destination $stagedExe
            if ((Get-FileHash -LiteralPath $stagedExe).Hash -ne $hash) { throw 'Stage bytes differ' }

            $phase = 'native-version-matrix'
            if (Test-Path -LiteralPath $nativeCache) { throw 'Expected a cold native cache' }
            # The managed case runs first on a fresh VM. Later cases may use the onefile cache.
            $results = [ordered] @{
              managedStaged = Test-OpenGrep $stagedExe $fixtureTemp $true
              ordinaryStaged = Test-OpenGrep $stagedExe $fixtureTemp $false
              ordinaryShort = Test-OpenGrep $shortExe $fixtureTemp $false
              managedShortTemp = Test-OpenGrep $stagedExe $shortTemp $true
            }
            if ((Get-FileHash -LiteralPath $shortExe).Hash -ne $hash -or (Get-FileHash -LiteralPath $stagedExe).Hash -ne $hash) {
              throw 'Version probe changed the executable'
            }
            Write-Output ('WINDOWS_OPENGREP_RESULT ' + (@{sha256 = $hash; probes = $results} | ConvertTo-Json -Depth 5 -Compress))
          } catch {
            Write-Output "WINDOWS_OPENGREP_FAILURE phase=$phase"
            $failed = $true
          } finally {
            try {
              if ($root -and (Test-Path -LiteralPath $root)) { Remove-Item -LiteralPath $root -Recurse -Force }
            } catch {
              Write-Output 'WINDOWS_OPENGREP_FAILURE phase=cleanup'
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
