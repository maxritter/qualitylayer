---
name: Recover the qualified 12.8 promotion

# One-time recovery: signed candidate/source remain fixed; only the test producer differs.
"on":
  workflow_dispatch:
    inputs:
      installed_receipt:
        description: Root's actual installed-release-candidate JSON for run 41342331355 attempt 1
        required: true
        type: string

permissions: {}
concurrency:
  group: recover-qualitylayer-12-8
  cancel-in-progress: false

env:
  VERSION: 12.8.0
  CANDIDATE_SOURCE: 2f7421b585bba4c6f6e59afa9aaae643f08848b0
  CANDIDATE_TREE: f8aa547ddd56340d4d852470135058b90b93cd07
  CANDIDATE_RUN: '41342331355'
  CANDIDATE_ATTEMPT: '1'
  TEST_SHA256: 63f4108d9c67e68d11f7ffbd5f5c70d01dd4d51cde54b298879208e5cfc8ec01

jobs:
  verify:
    name: Verify original candidate and recovery producer
    if: github.repository == 'maxritter/qualitylayer' && github.ref_name == 'main'
    permissions: { contents: read, actions: read, checks: read }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      assets_id: ${{ steps.identity.outputs.assets_id }}
      catalog_id: ${{ steps.identity.outputs.catalog_id }}
      bundle_digest: ${{ steps.identity.outputs.bundle_digest }}
      manifest_sha256: ${{ steps.identity.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the one-time producer to the qualified source
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = maxritter/qualitylayer ]
          [ "$GITHUB_REF_NAME" = main ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse "$CANDIDATE_SOURCE^{tree}")" = "$CANDIDATE_TREE" ]
          git merge-base --is-ancestor "$CANDIDATE_SOURCE" "$GITHUB_SHA"
          printf '%s\n' '.github/workflows/recover-12-8.yml' 'docs/site/scripts/db-beta9.test.ts' > "$RUNNER_TEMP/allowed-paths"
          git diff --name-only --no-renames "$CANDIDATE_SOURCE" "$GITHUB_SHA" | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          diff -u "$RUNNER_TEMP/allowed-paths" "$RUNNER_TEMP/actual-paths"
      - run: bash .github/workflows/scripts/install-git-crypt.sh
      - env: { GIT_CRYPT_KEY: "${{ secrets.GIT_CRYPT_KEY }}" }
        run: bash .github/workflows/scripts/setup-git-crypt.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: "1.4.2" }
      - name: Verify the corrected test producer
        run: |
          printf '%s  docs/site/scripts/db-beta9.test.ts\n' "$TEST_SHA256" | sha256sum -c -
      - name: Reuse only successful exact-source gates
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const sha = process.env.CANDIDATE_SOURCE;
            const required = ['Plaintext guard', 'Site API and pages',
              'Release smoke (ubuntu-latest)', 'Release smoke (macos-26)',
              'Source UI browser checks', 'supply-chain', 'Security Scan (Trivy)',
              'QualityLayer Tests', ...['ubuntu-latest', 'macos-26'].map(os => `No text overflows a control (${os})`),
              ...[1,2,3,4,5,6].map(n => `Native Windows runtime (windows-2025, shard ${n}/6)`)];
            const rows = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo, ref: sha, filter: 'all', per_page: 100
            });
            for (const name of required) {
              const latest = rows.filter(r => r.head_sha === sha && r.name === name && r.app?.slug === 'github-actions')
                .sort((a,b) => b.id-a.id)[0];
              if (latest?.status !== 'completed' || latest.conclusion !== 'success')
                throw new Error(`Exact-source gate ${name} is ${latest?.conclusion ?? 'missing'} for ${sha}`);
            }
      - name: Read the bounded exact run and artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ env.CANDIDATE_RUN }}
          CANDIDATE_ATTEMPT: ${{ env.CANDIDATE_ATTEMPT }}
          INSTALLED_RECEIPT: ${{ inputs.installed_receipt }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CANDIDATE_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          [ "${#INSTALLED_RECEIPT}" -le 16384 ]
          umask 077
          printf '%s\n' "$INSTALLED_RECEIPT" > "$RUNNER_TEMP/installed.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/attempts/$CANDIDATE_ATTEMPT" > "$RUNNER_TEMP/candidate-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/artifacts?per_page=100" | jq '{artifacts:[.[].artifacts[]]}' > "$RUNNER_TEMP/candidate-artifacts.json"
      - name: Download only the candidate's recorded manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualitylayer-candidate-manifest-${{ env.CANDIDATE_ATTEMPT }}
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Validate the exact successful run before downloading executables
        id: identity
        env: { VERSION: "${{ env.VERSION }}" }
        run: |
          set -euo pipefail
          bun qualitylayer/scripts/release-candidate.ts identity --candidate candidate/candidate.json --installed "$RUNNER_TEMP/installed.json" --run "$RUNNER_TEMP/candidate-run.json" --artifacts "$RUNNER_TEMP/candidate-artifacts.json" --branch "$GITHUB_REF_NAME" > "$RUNNER_TEMP/validated-candidate.json"
          jq -e --arg source "$CANDIDATE_SOURCE" --arg tree "$(git rev-parse "$CANDIDATE_SOURCE^{tree}")" --arg version "$VERSION" '.sourceCommit==$source and .sourceTree==$tree and .version==$version' "$RUNNER_TEMP/validated-candidate.json"
          jq -r '"assets_id=\(.assetsArtifact.id)\ncatalog_id=\(.catalogArtifact.id)\nbundle_digest=\(.bundleDigest)"' "$RUNNER_TEMP/validated-candidate.json" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(sha256sum candidate/candidate.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.identity.outputs.assets_id }},${{ steps.identity.outputs.catalog_id }}
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release
      - name: Verify all exact files and the existing production signature
        run: bun qualitylayer/scripts/release-candidate.ts promote --candidate candidate/candidate.json --installed "$RUNNER_TEMP/installed.json" --run "$RUNNER_TEMP/candidate-run.json" --artifacts "$RUNNER_TEMP/candidate-artifacts.json" --branch "$GITHUB_REF_NAME" --release-dir release


  publish:
    name: Recover publication of the installed signed candidate
    needs: verify
    environment: production
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_jAsHrk71vRyWK6bCTYGJyp0q
      VERCEL_PROJECT_ID: prj_SbOGJL2YBjvq9P5MSjxcrj87IGbi
      PRODUCTION_BRANCH: main
      MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
    steps:
      # The producer differs only in this workflow and the migration test; assets stay unchanged.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Vercel names a preview deployment after the branch it finds in git.
          git checkout -B "$GITHUB_REF_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.20.0"

      - name: Install git-crypt
        run: bash .github/workflows/scripts/install-git-crypt.sh

      - name: Unlock repository
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: bash .github/workflows/scripts/setup-git-crypt.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: qualitylayer
        run: bun install --frozen-lockfile

      - name: Download the same immutable assets, never rebuild them
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.assets_id }},${{ needs.verify.outputs.catalog_id }}
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualitylayer-candidate-manifest-${{ env.CANDIDATE_ATTEMPT }}
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify exact candidate bytes before any publication side effect
        env:
          {
            MANIFEST_SHA256: "${{ needs.verify.outputs.manifest_sha256 }}",
          }
        run: |
          set -euo pipefail
          printf '%s  candidate/candidate.json\n' "$MANIFEST_SHA256" | sha256sum -c -
          bun qualitylayer/scripts/release-candidate.ts verify-files --candidate candidate/candidate.json --release-dir release

      # Rebuilt from source at this commit; it must be the texts the build job hashed.
      - name: Rebuild the workflow texts
        working-directory: qualitylayer
        env:
          EXPECTED_DIGEST: ${{ needs.verify.outputs.bundle_digest }}
        run: |
          out="$(bun scripts/build.ts --workflow-bundle --out "${RUNNER_TEMP:?}/workflow-bundle.json")"
          digest="${out%% *}"
          if [ "$digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::the workflow texts differ from the build's: $digest, expected $EXPECTED_DIGEST"
            exit 1
          fi
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "BUNDLE=${RUNNER_TEMP:?}/workflow-bundle.json" >> "$GITHUB_ENV"

      - name: Install Vercel CLI
        run: npm install -g vercel@59.1.3

      - name: Install the site's dependencies
        working-directory: docs/site
        run: npm ci --ignore-scripts

      - name: Prepare the stable schema-9 deployment source
        if: ${{ !contains(env.VERSION, '-') }}
        run: |
          set -euo pipefail
          umask 077
          [ "$GITHUB_REF_NAME" = main ] && [ "$PRODUCTION_BRANCH" = main ]
          base=824d98db82ad92e3c172c6e577f22b461df4442b
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --quiet --no-tags --depth=1 origin "$base"
          source="$(mktemp -d "${RUNNER_TEMP:?}/ql-stable-source.XXXXXX")"
          prepared="${source}-backend"
          echo "DEPLOY_SOURCE=$source" >> "$GITHUB_ENV"
          echo "PREPARED_BACKEND=$prepared" >> "$GITHUB_ENV"
          common="$(git rev-parse --path-format=absolute --git-common-dir)"
          [ -f "$common/git-crypt/keys/default" ] || { echo "::error::git-crypt key is unavailable"; exit 1; }
          git clone --quiet --no-checkout --shared "$GITHUB_WORKSPACE" "$source"
          git -C "$source" remote set-url origin "$(git remote get-url origin)"
          for setting in filter.git-crypt.clean filter.git-crypt.smudge filter.git-crypt.required diff.git-crypt.textconv; do
            git -C "$source" config "$setting" "$(git config --get "$setting")"
          done

          mkdir -p "$source/.git/git-crypt/keys"
          cp "$common/git-crypt/keys/default" "$source/.git/git-crypt/keys/default"
          git -C "$source" checkout --quiet -B main "$CANDIDATE_SOURCE"
          [ "$(git -C "$source" rev-parse HEAD)" = "$CANDIDATE_SOURCE" ]
          ln -s "$GITHUB_WORKSPACE/docs/site/node_modules" "$source/docs/site/node_modules"
          preparer="$source/docs/site/scripts/prepare-beta-backend.mjs"
          node "$preparer" prepare --repo "$source" --frontend "$CANDIDATE_SOURCE" --out "$prepared" >/dev/null
          node "$preparer" verify --prepared "$prepared" --frontend "$CANDIDATE_SOURCE"
          mv "$source/docs/site/api" "$prepared/unused-current-api"
          cp -R "$prepared/api" "$source/docs/site/api"
          cp "$prepared/source-lineage.json" "$source/source-lineage.json"
          cp "$prepared/deployment-script-provenance.json" "$source/deployment-script-provenance.json"
          node "$preparer" verify --prepared "$prepared" --frontend "$CANDIDATE_SOURCE" --api "$source/docs/site/api"
          # The protected schema is pinned by verify; check its version before any database access.
          node -e 'const fs=require("node:fs");const sql=fs.readFileSync(process.argv[1],"utf8");const ns=[...sql.matchAll(/^-- migration (\d+)[ \t]*$/gm)].map(m=>Number(m[1]));if(JSON.stringify(ns)!==JSON.stringify([1,2,3,4,5,6,7,8,9]))throw Error("Stable deployment requires exactly the genuine schema-9 migrations");' "$source/docs/site/api/_lib/schema.sql"

      - name: Test the prepared stable schema-9 API
        if: ${{ !contains(env.VERSION, '-') }}
        working-directory: ${{ env.DEPLOY_SOURCE }}/docs/site
        # The schema-9 backend keeps the team hand-over routes for 12.0.0 clients; the current
        # source no longer calls them, so only their "has a caller" checks are skipped here.
        # Caller coverage of the current API runs in CI.
        run: |
          set -euo pipefail
          npx vitest run --maxWorkers=2 --dir api -t '^(?!.*team/tasks/\[task\]/(claim|handed) has a caller).*$'
          test_file=scripts/db-beta9.test.ts
          backup="${RUNNER_TEMP:?}/candidate-db-beta9.test.ts"
          cp "$test_file" "$backup"
          original=$(sha256sum "$backup" | awk '{print $1}')
          trap 'cp "$backup" "$test_file"' EXIT
          cp "$GITHUB_WORKSPACE/docs/site/$test_file" "$test_file"
          printf '%s  %s\n' "$TEST_SHA256" "$test_file" | sha256sum -c -
          npx vitest run --maxWorkers=2 scripts/db-beta9.test.ts
          cp "$backup" "$test_file"
          printf '%s  %s\n' "$original" "$test_file" | sha256sum -c -
          trap - EXIT
          jq -n --arg candidate "$CANDIDATE_SOURCE" --arg producer "$GITHUB_SHA" --arg test "$TEST_SHA256" \
            '{candidateSource:$candidate,testProducer:$producer,testSha256:$test,preparedApiTests:"passed",migrationTests:"passed",candidateTestRestored:true}' > "$RUNNER_TEMP/recovery-test-receipt.json"

      # The schema of the environment being released to goes first: the new handlers need its
      # tables, and a failed migration stops the release before anything is deployed.
      - name: Apply the database schema
        if: ${{ !contains(env.VERSION, '-') }}
        working-directory: ${{ env.DEPLOY_SOURCE }}/docs/site
        run: |
          set -euo pipefail
          umask 077
          [ "$GITHUB_REF_NAME" = main ] && [ "$PRODUCTION_BRANCH" = main ]
          node scripts/prepare-beta-backend.mjs verify --prepared "${PREPARED_BACKEND:?}" --frontend "$CANDIDATE_SOURCE" --api "${DEPLOY_SOURCE:?}/docs/site/api"
          pull="${RUNNER_TEMP:?}/database.env"
          trap 'rm -f "$pull"' EXIT
          vercel env pull "$pull" --environment=production --token="$VERCEL_TOKEN" --yes
          # Migrations run as the database owner; the routes may use a narrower role.
          value() { sed -n "s/^$1=\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\}\$/\\1/p" "$pull"; }
          DATABASE_URL="$(value OWNER_DATABASE_URL)"
          [ -n "$DATABASE_URL" ] || DATABASE_URL="$(value DATABASE_URL)"
          rm -f "$pull"
          [ -n "$DATABASE_URL" ] || { echo "::error::no database is set for this environment"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          export MIGRATION_DATABASE_URL="$DATABASE_URL"
          node scripts/db-migrate.ts
          node scripts/db-beta9.ts --email-schema api/_lib/beta9-email-schema.sql

      # Stable main uses the same pinned schema-9 service as the live beta, on Production.
      - name: Deploy the site at this commit
        if: ${{ !contains(env.VERSION, '-') }}
        id: deploy
        run: |
          umask 077
          [ "$GITHUB_REF_NAME" = main ] && [ "$PRODUCTION_BRANCH" = main ]
          receipt="${RUNNER_TEMP:?}/website-deployment.json"
          runtime="${RUNNER_TEMP:?}/website-runtime.json"
          source="${DEPLOY_SOURCE:?}"
          prepared="${PREPARED_BACKEND:?}"
          verifier="$source/docs/site/scripts/verify-deployment-runtime.mjs"
          preparer="$source/docs/site/scripts/prepare-beta-backend.mjs"
          node "$preparer" verify --prepared "$prepared" --frontend "$CANDIDATE_SOURCE" --api "$source/docs/site/api"
          backend_base=824d98db82ad92e3c172c6e577f22b461df4442b
          backend_digest="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).overlayDigest)' "$prepared/receipt.json")"
          target=production
          (cd "$source" && vercel deploy --token="$VERCEL_TOKEN" --prod --skip-domain --json --build-env QUALITYLAYER_BACKEND_PROFILE=legacy9 --meta "githubCommitRef=$GITHUB_REF_NAME" --meta "githubCommitSha=$CANDIDATE_SOURCE" --meta "backendBaseSha=$backend_base" --meta "backendOverlayDigest=$backend_digest") > "$receipt"
          deployment_id=$(node "$verifier" receipt-id --deployment "$receipt")
          vercel api "/v13/deployments/$deployment_id" --method GET --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --raw > "$runtime"
          DEPLOY_URL=$(node "$verifier" verify --deployment "$receipt" --metadata "$runtime" --project "$VERCEL_PROJECT_ID" --target "$target" --git-ref "$GITHUB_REF_NAME" --git-sha "$CANDIDATE_SOURCE")
          node "$preparer" verify-runtime --prepared "$prepared" --frontend "$CANDIDATE_SOURCE" --api "$source/docs/site/api" --metadata "$runtime"
          bash "$source/docs/site/scripts/check-deploy.sh" "$DEPLOY_URL" --pending-release "$VERSION"
          echo "Deployed to: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Upload the workflow texts and read them back
        working-directory: docs/site
        run: |
          set -euo pipefail
          umask 077
          if [[ "$VERSION" != *-* ]]; then
            [ "$GITHUB_REF_NAME" = main ] && [ "$PRODUCTION_BRANCH" = main ]
            cd "${DEPLOY_SOURCE:?}/docs/site"
            node scripts/prepare-beta-backend.mjs verify --prepared "${PREPARED_BACKEND:?}" --frontend "$CANDIDATE_SOURCE" --api "${DEPLOY_SOURCE:?}/docs/site/api"
          fi
          # Released stable and beta Apps both use normal Production accounts.
          # This writes only their signed, versioned workflow bundle; beta API code stays in Preview.
          pull="${RUNNER_TEMP:?}/database.env"
          trap 'rm -f "$pull"' EXIT
          vercel env pull "$pull" --environment=production --token="$VERCEL_TOKEN" --yes
          value() { sed -n "s/^$1=\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\}\$/\\1/p" "$pull"; }
          DATABASE_URL="$(value OWNER_DATABASE_URL)"
          [ -n "$DATABASE_URL" ] || DATABASE_URL="$(value DATABASE_URL)"
          rm -f "$pull"
          [ -n "$DATABASE_URL" ] || { echo "::error::no database is set for this environment"; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          node scripts/upload-workflow.ts upload "$VERSION" "$BUNDLE" "$DIGEST"

      - name: A fresh trial gets the texts from the deployment
        working-directory: docs/site
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url || 'https://qualitylayer.dev' }}
        run: |
          if [[ "$VERSION" != *-* ]]; then cd "${DEPLOY_SOURCE:?}/docs/site"; fi
          node scripts/upload-workflow.ts probe "$VERSION" "$DEPLOY_URL"

      # The manifest carries the GitHub draft's notes, frozen during staging.
      - name: The release notes, from the manifest
        run: |
          if ! jq -ej '.notes | select(length > 0)' release/latest.json > "${RUNNER_TEMP:?}/release-notes.md"; then
            echo "::error::latest.json carries no release notes"
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=${RUNNER_TEMP:?}/release-notes.md" >> "$GITHUB_ENV"

      - name: Record same-byte promotion provenance with both source identities
        run: |
          set -euo pipefail
          jq -n --arg repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --arg producer "$GITHUB_SHA" \
            --arg candidate "$CANDIDATE_SOURCE" --arg tree "$CANDIDATE_TREE" --arg test "$TEST_SHA256" \
            --arg invocation "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --arg manifest "$MANIFEST_SHA256" --slurpfile c candidate/candidate.json \
            --slurpfile tests "$RUNNER_TEMP/recovery-test-receipt.json" \
            '{buildDefinition:{buildType:($repository+"/.github/workflows/recover-12-8.yml@"+$producer),
              externalParameters:{operation:"promote-existing-signed-candidate",candidateRun:"41342331355",candidateAttempt:1,testProducer:$tests[0]},
              internalParameters:{},resolvedDependencies:[
                {uri:($repository+"/tree/"+$candidate),digest:{gitCommit:$candidate,gitTree:$tree}},
                {uri:($repository+"/tree/"+$producer),digest:{gitCommit:$producer}},
                {uri:($repository+"/actions/runs/41342331355/artifacts/"+$c[0].assetsArtifact.id),digest:{sha256:($c[0].assetsArtifact.digest|sub("^sha256:";""))}},
                {uri:($repository+"/actions/runs/41342331355/artifacts/"+$c[0].catalogArtifact.id),digest:{sha256:($c[0].catalogArtifact.digest|sub("^sha256:";""))}},
                {uri:"candidate/candidate.json",digest:{sha256:$manifest}},
                {uri:($repository+"/blob/"+$producer+"/docs/site/scripts/db-beta9.test.ts"),digest:{sha256:$test}}]},
              runDetails:{builder:{id:($repository+"/.github/workflows/recover-12-8.yml@"+$producer)},metadata:{invocationId:$invocation}}}' \
            > "$RUNNER_TEMP/recovery-provenance.json"
      - name: Attest the existing signed bytes, not a new compilation
        uses: actions/attest@e59cbc1ad1ac2d59339667419eb8cdde6eb61e3d # v3.2.0, already pinned by attest-build-provenance
        with:
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/recovery-provenance.json
          subject-path: |
            release/qualitylayer-darwin-arm64
            release/qualitylayer-darwin-x64
            release/qualitylayer-linux-arm64
            release/qualitylayer-linux-x64
            release/qualitylayer-windows-x64.exe
            release/install.sh
            release/install.ps1
            release/QualityLayer-*.dmg
            release/QualityLayer-*.app.tar.gz
            release/QualityLayer-*-setup.exe
            release/QualityLayer-*.AppImage

      - name: Retain recovery qualification and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-12-8-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/recovery-test-receipt.json
            ${{ runner.temp }}/recovery-provenance.json
          if-no-files-found: error
      - name: Create only the exact promoted candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ env.CANDIDATE_RUN }}
          CANDIDATE_ATTEMPT: ${{ env.CANDIDATE_ATTEMPT }}
          MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          marker="<!-- qualitylayer-candidate:$CANDIDATE_RUN:$CANDIDATE_ATTEMPT:$MANIFEST_SHA256 -->"
          printf '\n%s\n' "$marker" >> "$RELEASE_NOTES_FILE"
          # Refuse to overwrite edits made after qualification. A changed draft needs restaging.
          bash .github/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/current-notes.md"
          diff -u <(jq -r '.notes | sub("\\s+$"; "")' release/latest.json) "$RUNNER_TEMP/current-notes.md"
          gh release view "v$VERSION" --json body,isDraft,targetCommitish,assets > "$RUNNER_TEMP/existing-release.json"
          if jq -e --arg marker "$marker" '.body | contains($marker)' "$RUNNER_TEMP/existing-release.json" >/dev/null; then
            # A retry may resume only the candidate that owns this draft or published release.
            jq -e --arg sha "$CANDIDATE_SOURCE" '.targetCommitish == $sha' "$RUNNER_TEMP/existing-release.json"
          else
            # Claim only an unpublished, asset-free authoring draft with no earlier candidate marker.
            jq -e '.isDraft == true and (.assets | length) == 0 and (.body | contains("<!-- qualitylayer-candidate:") | not)' "$RUNNER_TEMP/existing-release.json"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            git fetch --quiet origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            [ "$(git rev-parse "v$VERSION^{commit}")" = "$CANDIDATE_SOURCE" ]
          fi
          gh release edit "v$VERSION" --target "$CANDIDATE_SOURCE" --notes-file "$RELEASE_NOTES_FILE"

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ((i = 1; i <= 12; i++)); do
            gh release view "v${VERSION}" >/dev/null 2>&1 && break
            [ "$i" -eq 12 ] && { echo "Release v${VERSION} was not created"; exit 1; }
            sleep 5
          done
          # Everything the manifest names goes up first.
          find release -type f ! -name latest.json -print0 | xargs -0 gh release upload "v${VERSION}" --clobber

      # The updater reads latest.json through qualitylayer.dev, which skips a release that has
      # none: it appears only once every package and signature it names can be downloaded.
      - name: Upload latest.json last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION}" release/latest.json --clobber
          # The published list must match the guarded one exactly.
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | sort > published.txt
          find release -type f -printf '%f\n' | sort > expected.txt
          diff -u expected.txt published.txt

      - name: Publish only the complete candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "v$VERSION" --draft=false --prerelease --latest=false
          else
            gh release edit "v$VERSION" --draft=false --prerelease=false --latest
            [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v$VERSION" ]
          fi

      # A stable release retires the betas that led to it, so the Releases page lists betas only
      # for a version with no stable release yet. Their tags stay.
      - name: Remove the betas this stable release supersedes
        if: ${{ !contains(env.VERSION, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease and (.draft | not)) | .tag_name' |
            while read -r tag; do
              base="${tag#v}"
              base="${base%%-*}"
              [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              if [ "$(printf '%s\n%s\n' "$base" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then
                gh release delete "$tag" --yes
              fi
            done

      # The domains move only to a Production deployment of the branch's tip: a newer commit
      # that landed meanwhile keeps them.
      - name: Point qualitylayer.dev at this release
        if: ${{ !contains(env.VERSION, '-') && github.ref_name == 'main' }}
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          bash "${DEPLOY_SOURCE:?}/docs/site/scripts/check-deploy.sh" "$DEPLOY_URL"
          git fetch --quiet origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse "origin/$GITHUB_REF_NAME")" != "$GITHUB_SHA" ]; then
            echo "::warning::$GITHUB_REF_NAME moved past recovery producer $GITHUB_SHA; qualitylayer.dev stays on the newer deployment"
            exit 0
          fi
          printf '%s\n' '.github/workflows/recover-12-8.yml' 'docs/site/scripts/db-beta9.test.ts' > "$RUNNER_TEMP/final-allowed"
          git diff --name-only --no-renames "$CANDIDATE_SOURCE" "$GITHUB_SHA" | LC_ALL=C sort > "$RUNNER_TEMP/final-actual"
          diff -u "$RUNNER_TEMP/final-allowed" "$RUNNER_TEMP/final-actual"
          vercel promote "$DEPLOY_URL" --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Remove private stable deployment sources
        if: always()
        run: |
          for path in "${DEPLOY_SOURCE:-}" "${PREPARED_BACKEND:-}"; do
            case "$path" in
              "${RUNNER_TEMP:?}"/ql-stable-source.*) rm -rf -- "$path" ;;
              "") ;;
              *) echo "::error::refusing to remove an unexpected stable deployment path"; exit 1 ;;
            esac
          done

